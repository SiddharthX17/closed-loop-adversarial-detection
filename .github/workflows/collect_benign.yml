name: Collect Benign Corpus

on:
  schedule:
    - cron: '0 0 * * 0'   # Sunday midnight
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Sysmon
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Sysmon.zip" -OutFile "$env:TEMP\Sysmon.zip"
          Expand-Archive "$env:TEMP\Sysmon.zip" -DestinationPath "$env:TEMP\Sysmon"

      - name: Download SwiftOnSecurity config
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml" -OutFile "$env:TEMP\sysmonconfig.xml"

      - name: Install Sysmon
        shell: powershell
        run: |
          Start-Process "$env:TEMP\Sysmon\Sysmon64.exe" -ArgumentList "-accepteula -i $env:TEMP\sysmonconfig.xml" -Wait -Verb RunAs

      - name: Simulate benign process activity (EID 1)
        shell: powershell
        run: |
          # Parent-child chains with randomised delays
          foreach ($i in 1..10) {
            Start-Process cmd.exe -ArgumentList "/c whoami /all" -Wait
            Start-Sleep -Milliseconds (Get-Random -Minimum 200 -Maximum 800)

            Start-Process cmd.exe -ArgumentList "/c powershell -NonInteractive -Command Get-Date" -Wait
            Start-Sleep -Milliseconds (Get-Random -Minimum 100 -Maximum 500)

            Start-Process cmd.exe -ArgumentList "/c ipconfig /all" -Wait
            Start-Sleep -Milliseconds (Get-Random -Minimum 150 -Maximum 600)

            Start-Process notepad.exe -PassThru | ForEach-Object {
              Start-Sleep -Milliseconds 300
              $_.Kill()
            }
            Start-Sleep -Milliseconds (Get-Random -Minimum 200 -Maximum 700)

            Start-Process cmd.exe -ArgumentList "/c tasklist /fo csv /nh" -Wait
            Start-Sleep -Milliseconds (Get-Random -Minimum 100 -Maximum 400)
          }

      - name: Simulate benign registry activity (EID 12/13)
        shell: powershell
        run: |
          foreach ($i in 1..10) {
            # Write and delete a scratch key — generates EID 13 + EID 12
            $key = "HKCU:\Software\BenignCorpusTest\Run$i"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name "TestValue" -Value "BenignData$i"
            Start-Sleep -Milliseconds (Get-Random -Minimum 100 -Maximum 400)
            Remove-Item -Path $key -Recurse -Force
            Start-Sleep -Milliseconds (Get-Random -Minimum 100 -Maximum 300)
          }

      - name: Simulate benign network activity (EID 3)
        shell: powershell
        run: |
          $urls = @(
            "https://www.google.com",
            "https://github.com",
            "https://windowsupdate.microsoft.com",
            "https://www.microsoft.com"
          )
          foreach ($i in 1..5) {
            foreach ($url in $urls) {
              try {
                Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5 | Out-Null
              } catch {}
              Start-Sleep -Milliseconds (Get-Random -Minimum 300 -Maximum 900)
            }
          }

      - name: Wait for Sysmon to flush events
        shell: powershell
        run: Start-Sleep -Seconds 10

      - name: Export Sysmon events to JSONL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path corpus/benign/process
          New-Item -ItemType Directory -Force -Path corpus/benign/network
          New-Item -ItemType Directory -Force -Path corpus/benign/registry

          $events = Get-WinEvent -LogName "Microsoft-Windows-Sysmon/Operational" -ErrorAction SilentlyContinue

          # EID 1 → process/
          $eid1 = $events | Where-Object { $_.Id -eq 1 }
          $eid1 | ForEach-Object {
            $xml = [xml]$_.ToXml()
            $data = @{ Channel = "Microsoft-Windows-Sysmon/Operational"; EventID = 1 }
            $xml.Event.EventData.Data | ForEach-Object { $data[$_.Name] = $_.'#text' }
            $data | ConvertTo-Json -Compress
          } | Set-Content -Path "corpus/benign/process/gh_actions_$(Get-Date -Format 'yyyyMMdd_HHmmss').jsonl" -Encoding UTF8

          # EID 3 → network/
          $eid3 = $events | Where-Object { $_.Id -eq 3 }
          $eid3 | ForEach-Object {
            $xml = [xml]$_.ToXml()
            $data = @{ Channel = "Microsoft-Windows-Sysmon/Operational"; EventID = 3 }
            $xml.Event.EventData.Data | ForEach-Object { $data[$_.Name] = $_.'#text' }
            $data | ConvertTo-Json -Compress
          } | Set-Content -Path "corpus/benign/network/gh_actions_$(Get-Date -Format 'yyyyMMdd_HHmmss').jsonl" -Encoding UTF8

          # EID 11/12/13 → registry/
          $eidReg = $events | Where-Object { $_.Id -in @(11, 12, 13) }
          $eidReg | ForEach-Object {
            $eid = $_.Id
            $xml = [xml]$_.ToXml()
            $data = @{ Channel = "Microsoft-Windows-Sysmon/Operational"; EventID = $eid }
            $xml.Event.EventData.Data | ForEach-Object { $data[$_.Name] = $_.'#text' }
            $data | ConvertTo-Json -Compress
          } | Set-Content -Path "corpus/benign/registry/gh_actions_$(Get-Date -Format 'yyyyMMdd_HHmmss').jsonl" -Encoding UTF8

          # Summary
          Write-Host "EID1: $($eid1.Count) | EID3: $($eid3.Count) | EID11/12/13: $($eidReg.Count)"

      - name: Commit corpus to repo
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/benign/
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m "chore: refresh benign corpus [skip ci]"
            git push
          } else {
            Write-Host "No new corpus files to commit"
          }
