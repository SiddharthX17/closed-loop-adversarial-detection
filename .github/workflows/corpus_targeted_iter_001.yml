      # Cluster: singleton_ebb3a0a5-6892-4987-8f63-8f93c4fe278e
      # Intent: Detect execution of legitimate Windows system binaries from non-standard locations or with mismatched OriginalFileName metadata, a technique used to evade binary whitelisting and masquerade as system tools.
      # Rules: ebb3a0a5-6892-4987-8f63-8f93c4fe278e
      - name: "Detect execution of legitimate Windows system [IT admin workflow]"
        shell: powershell
        run: |
          $tempPath = [System.IO.Path]::GetTempPath()
          $stagingDir = Join-Path $tempPath 'SysRecovery_$(Get-Random)'
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          try {
            # Extract cmd.exe to staging directory for safe execution during recovery workflow
            $systemCmd = 'C:\Windows\System32\cmd.exe'
            $stagedCmd = Join-Path $stagingDir 'cmd.exe'
            Copy-Item -Path $systemCmd -Destination $stagedCmd -Force

            # Execute legitimate command from non-standard location
            # Generates Sysmon EID 1 (Process Create) with Image from temp, OriginalFileName=cmd.exe
            & $stagedCmd /c "echo Recovery mode: System health check" 2>&1 | Out-Null

            # Simulate second phase: rundll32 extraction for shell integration test
            $systemRundll = 'C:\Windows\System32\rundll32.exe'
            $stagedRundll = Join-Path $stagingDir 'rundll32.exe'
            Copy-Item -Path $systemRundll -Destination $stagedRundll -Force

            # Execute rundll32 from temp with shell32.dll routine
            # Generates Sysmon EID 1 with Image from temp, OriginalFileName=rundll32.exe
            & $stagedRundll shell32.dll,Control_RunDLL /c 2>&1 | Out-Null

            # Simulate explorer.exe staging for file system recovery operation
            $systemExplorer = 'C:\Windows\explorer.exe'
            $stagedExplorer = Join-Path $stagingDir 'explorer.exe'
            Copy-Item -Path $systemExplorer -Destination $stagedExplorer -Force

            # Execute explorer from temp location
            # Generates Sysmon EID 1 with Image from temp, OriginalFileName=explorer.exe
            & $stagedExplorer /root 2>&1 | Out-Null

            Write-Host "Recovery workflow completed: staged binaries executed from temporary location"
          } finally {
            # Cleanup: remove staging directory and all extracted binaries
            if (Test-Path $stagingDir) {
              Remove-Item -Path $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: "Detect execution of legitimate Windows system [Software installer/updater workflow]"
        shell: powershell
        run: |
          $appDataPath = $env:APPDATA
          $updateStaging = Join-Path $appDataPath 'Microsoft\WindowsUpdate\Staging'
          New-Item -ItemType Directory -Path $updateStaging -Force | Out-Null

          try {
            # Simulate update preparation: extract system binaries for component verification
            # This mirrors real Windows Update behavior where binaries are staged before patching

            $binariesToStage = @(
              'C:\Windows\System32\cmd.exe',
              'C:\Windows\System32\powershell.exe',
              'C:\Windows\System32\mshta.exe',
              'C:\Windows\System32\rundll32.exe'
            )

            foreach ($binary in $binariesToStage) {
              if (Test-Path $binary) {
                $fileName = Split-Path $binary -Leaf
                $stagedPath = Join-Path $updateStaging $fileName
                Copy-Item -Path $binary -Destination $stagedPath -Force
              }
            }

            # Parent process simulation: msiexec spawns staged cmd.exe for update prerequisite check
            # Generates Sysmon EID 1 with ParentImage containing msiexec.exe
            $stagedCmd = Join-Path $updateStaging 'cmd.exe'
            if (Test-Path $stagedCmd) {
              $processInfo = New-Object System.Diagnostics.ProcessStartInfo
              $processInfo.FileName = $stagedCmd
              $processInfo.Arguments = '/c ver'
              $processInfo.UseShellExecute = $false
              $processInfo.RedirectStandardOutput = $true
              $process = [System.Diagnostics.Process]::Start($processInfo)
              $process.WaitForExit(2000)
            }

            # Simulate dism.exe parent spawning mshta for update script execution
            # Generates Sysmon EID 1 with ParentImage containing dism.exe
            $stagedMshta = Join-Path $updateStaging 'mshta.exe'
            if (Test-Path $stagedMshta) {
              $processInfo = New-Object System.Diagnostics.ProcessStartInfo
              $processInfo.FileName = $stagedMshta
              $processInfo.Arguments = 'about:blank'
              $processInfo.UseShellExecute = $false
              $processInfo.RedirectStandardOutput = $true
              $process = [System.Diagnostics.Process]::Start($processInfo)
              $process.WaitForExit(2000)
            }

            # Stage rundll32 in ProgramData for broader update testing
            $programDataUpdatePath = Join-Path $env:ProgramData 'WindowsUpdate\StageDir'
            New-Item -ItemType Directory -Path $programDataUpdatePath -Force | Out-Null

            $systemRundll = 'C:\Windows\System32\rundll32.exe'
            if (Test-Path $systemRundll) {
              $stagedRundllProgramData = Join-Path $programDataUpdatePath 'rundll32.exe'
              Copy-Item -Path $systemRundll -Destination $stagedRundllProgramData -Force

              # Execute rundll32 from ProgramData location with shell32.dll routine
              # Generates Sysmon EID 1 with Image containing \programdata\, OriginalFileName=rundll32.exe
              $processInfo = New-Object System.Diagnostics.ProcessStartInfo
              $processInfo.FileName = $stagedRundllProgramData
              $processInfo.Arguments = 'shell32.dll,ShellExec_RunDLL notepad.exe'
              $processInfo.UseShellExecute = $false
              $processInfo.CreateNoWindow = $true
              $process = [System.Diagnostics.Process]::Start($processInfo)
              $process.WaitForExit(2000)
            }

            Write-Host "Update staging workflow completed: system binaries extracted and verified"
          } finally {
            # Cleanup: remove staging directories
            if (Test-Path $updateStaging) {
              Remove-Item -Path $updateStaging -Recurse -Force -ErrorAction SilentlyContinue
            }
            $programDataUpdatePath = Join-Path $env:ProgramData 'WindowsUpdate\StageDir'
            if (Test-Path $programDataUpdatePath) {
              Remove-Item -Path $programDataUpdatePath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: "Detect execution of legitimate Windows system [User-driven workflow]"
        shell: powershell
        run: |
          $downloadPath = Join-Path $env:TEMP 'DownloadedTools'
          New-Item -ItemType Directory -Path $downloadPath -Force | Out-Null

          try {
            # Simulate user extracting portable utilities downloaded from vendor site
            # Tools retain legitimate OriginalFileName but execute from user temp location

            $userTemp = $env:TEMP
            $userPublic = [System.Environment]::GetFolderPath([System.Environment+SpecialFolder]::CommonDocuments)
            $userAppData = Join-Path $env:APPDATA 'DownloadedApps'
            New-Item -ItemType Directory -Path $userAppData -Force | Out-Null

            # Extract system binaries for portable toolkit
            @('C:\Windows\System32\cmd.exe', 'C:\Windows\System32\powershell.exe') | ForEach-Object {
              if (Test-Path $_) {
                $fileName = Split-Path $_ -Leaf
                Copy-Item -Path $_ -Destination (Join-Path $downloadPath $fileName) -Force
                Copy-Item -Path $_ -Destination (Join-Path $userAppData $fileName) -Force
              }
            }

            # Execute cmd.exe from user temp location
            # Generates Sysmon EID 1 with Image containing \temp\, OriginalFileName=cmd.exe
            $cmd = Join-Path $downloadPath 'cmd.exe'
            if (Test-Path $cmd) {
              & $cmd /c "dir $downloadPath" 2>&1 | Out-Null
            }

            # Execute powershell.exe from AppData location
            # Generates Sysmon EID 1 with Image containing \appdata\, OriginalFileName=powershell.exe
            $ps = Join-Path $userAppData 'powershell.exe'
            if (Test-Path $ps) {
              & $ps -NoProfile -Command "Write-Host 'Tool executed'"; 2>&1 | Out-Null
