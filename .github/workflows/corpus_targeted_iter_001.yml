            # Extract and execute from Users\Public location
            # Generates Sysmon EID 1 with Image containing \users\public\
            $publicPath = Join-Path $userPublic 'SharedTools'
            New-Item -ItemType Directory -Path $publicPath -Force | Out-Null

            $systemCmd = 'C:\Windows\System32\cmd.exe'
            if (Test-Path $systemCmd) {
              $publicCmd = Join-Path $publicPath 'cmd.exe'
              Copy-Item -Path $systemCmd -Destination $publicCmd -Force

              $processInfo = New-Object System.Diagnostics.ProcessStartInfo
              $processInfo.FileName = $publicCmd
              $processInfo.Arguments = '/c echo System maintenance complete'
              $processInfo.UseShellExecute = $false
              $processInfo.RedirectStandardOutput = $true
