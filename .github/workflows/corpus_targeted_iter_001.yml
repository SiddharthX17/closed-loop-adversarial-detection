          # This command pattern triggers detection due to process inspection + diagnostic flag

          Write-Host "[SECURITY] Collecting diagnostic information for threat analysis"

          # Real Defender diagnostic collection via WMI
          $defenderStatus = Get-WmiObject -Namespace 'root\Microsoft\Windows\Defender' `
            -Class MSFT_MpComputerStatus -ErrorAction SilentlyContinue

          if ($defenderStatus) {
