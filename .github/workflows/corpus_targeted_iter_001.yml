      - name: "Detect credential theft via LSASS memory dumps [IT admin workflow]"
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # Security maintenance: Defender threat scan and diagnostic collection
          # Real defenders regularly initiate scans for security validation

          $defenderPath = 'C:\Program Files\Windows Defender\mpcmdrun.exe'
          $defenderAlt = 'C:\ProgramData\Microsoft\Windows Defender\platform\*\MpCmdRun.exe'

          Write-Host "[SECURITY] Initiating Windows Defender diagnostic scan"

