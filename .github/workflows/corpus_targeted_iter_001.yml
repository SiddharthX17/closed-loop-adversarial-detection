          }


      - name: "Detect adversaries creating scheduled tasks via [IT admin workflow]"
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # Simulate compliance/hardening workflow: bulk task configuration via registry
          # This is common in enterprise environments where admins apply baseline configurations

          $complianceRegPath = 'HKLM:\SOFTWARE\atomic-t1053.005\microsoft\windows'

