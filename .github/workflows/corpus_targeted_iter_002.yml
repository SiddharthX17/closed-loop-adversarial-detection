            & $stagedCmd /c 'echo System diagnostics validation' | Out-Null
          }

          $psPath = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if ($psPath) {
            Copy-Item -Path $psPath.Source -Destination (Join-Path $tempStaging 'powershell.exe') -Force
            $stagedPs = Join-Path $tempStaging 'powershell.exe'
            & $stagedPs -NoProfile -Command 'Write-Output "Diagnostics check complete" 2>&1' | Out-Null
          }

