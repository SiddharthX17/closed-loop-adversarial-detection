      # Cluster: singleton_7aa329c4-c43c-435e-b731-126a0a9fdfc2
      # Intent: Detect execution of system binaries (cmd.exe, powershell.exe, etc.) from user-writable directories or non-standard locations, which indicates masquerading or evasion attempts.
