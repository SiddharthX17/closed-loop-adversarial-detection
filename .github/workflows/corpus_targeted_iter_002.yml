on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-corpus:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Sysmon
        shell: powershell
        run: |
          $sysmonUrl = "https://download.sysinternals.com/files/Sysmon.zip"
          $configUrl = "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml"
          Invoke-WebRequest -Uri $sysmonUrl -OutFile Sysmon.zip
          Expand-Archive -Path Sysmon.zip -DestinationPath Sysmon
          Invoke-WebRequest -Uri $configUrl -OutFile sysmonconfig.xml
          .\Sysmon\Sysmon64.exe -accepteula -i sysmonconfig.xml
          Start-Sleep -Seconds 3
          Write-Host "Sysmon installed"

      # Cluster: singleton_334ae9aa-6f1f-4de8-83c4-db90f3a89593
      # Intent: Detect scheduled task creation via command-line tools (schtasks, wmic, PowerShell) combined with script interpreter invocation and code obfuscation indicators (encoding, base64, hidden execution).
      # Rules: 334ae9aa-6f1f-4de8-83c4-db90f3a89593
      - name: "Detect scheduled task creation via command-line [IT admin workflow]"
        shell: cmd
        run: |
          REM Create a scheduled task for daily compliance log collection
          REM This is a legitimate administrative maintenance workflow
          set AUDITSCRIPT=%TEMP%\ComplianceAudit.ps1
          set LOGPATH=%TEMP%\AuditLogs

          if not exist "%LOGPATH%" mkdir "%LOGPATH%"

          REM Write a benign PowerShell script that collects security event logs
          (
            echo # Compliance audit script - collects security events
            echo $events = Get-EventLog -LogName Security -Newest 1000 -AsBaseObject
            echo $events ^| Export-Csv -Path "%LOGPATH%\security_audit.csv" -NoTypeInformation
            echo Write-Host "Audit complete: $(Get-Date)"
          ) > "%AUDITSCRIPT%"

          REM Create scheduled task using schtasks - triggers at system startup
          schtasks /create /tn "SystemMaintenance\ComplianceAudit" /tr "powershell.exe -NoProfile -ExecutionPolicy Bypass -File '%AUDITSCRIPT%'" /sc onstart /f

          REM Verify task was created
          schtasks /query /tn "SystemMaintenance\ComplianceAudit"

          REM Clean up
          timeout /t 2 /nobreak
          schtasks /delete /tn "SystemMaintenance\ComplianceAudit" /f
          if exist "%AUDITSCRIPT%" del /f /q "%AUDITSCRIPT%"
          if exist "%LOGPATH%" rmdir /s /q "%LOGPATH%"


      - name: "Detect scheduled task creation via command-line [Software installer/updater workflow]"
        shell: powershell
        run: |
          $BackupTaskPath = Join-Path $env:TEMP 'BackupJobConfig.ps1'
          $BackupLogPath = Join-Path $env:TEMP 'BackupLogs'

          # Create backup log directory if it does not exist
          if (-not (Test-Path $BackupLogPath)) {
              New-Item -ItemType Directory -Path $BackupLogPath -Force | Out-Null
          }

          # Write backup job script - simulates Veeam-style incremental backup configuration
          $BackupScript = @'
          [CmdletBinding()]
          param()

          $BackupPath = Join-Path $env:TEMP "BackupLogs"
          $Timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $BackupLog = Join-Path $BackupPath "backup_$Timestamp.log"

          Add-Content -Path $BackupLog -Value "Backup job started at $(Get-Date)"
          Add-Content -Path $BackupLog -Value "Performing incremental backup of configuration data"
          Add-Content -Path $BackupLog -Value "Backup job completed at $(Get-Date)"
          '@

          # Encode the backup script for safe transport/storage (standard practice for credential protection)
          $ScriptBytes = [System.Text.Encoding]::Unicode.GetBytes($BackupScript)
          $EncodedScript = [Convert]::ToBase64String($ScriptBytes)

          # Decode and execute to verify - simulates installer verification
          $DecodedScript = [System.Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($EncodedScript))
          $DecodedScript | Out-File -FilePath $BackupTaskPath -Encoding UTF8 -Force

          # Register scheduled task for daily backup at logon
          $TaskName = "SystemMaintenance\IncrementalBackup"
          $TaskDescription = "Daily incremental backup job - managed by backup software"
          $TaskAction = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -File '$BackupTaskPath'"
          $TaskTrigger = New-ScheduledTaskTrigger -AtLogOn
          $TaskSettings = New-ScheduledTaskSettingsSet -RunOnlyIfNetworkAvailable -StartWhenAvailable

          # Check if task exists, remove it first
          if (Get-ScheduledTask -TaskName 'IncrementalBackup' -TaskPath 'SystemMaintenance\' -ErrorAction SilentlyContinue) {
              Unregister-ScheduledTask -TaskName 'IncrementalBackup' -TaskPath 'SystemMaintenance\' -Confirm:$false
          }

          # Register the task
          Register-ScheduledTask -TaskName 'IncrementalBackup' -TaskPath 'SystemMaintenance\' -Action $TaskAction -Trigger $TaskTrigger -Settings $TaskSettings -Description $TaskDescription -Force

          Start-Sleep -Seconds 2

          # Verify task registration
          Get-ScheduledTask -TaskName 'IncrementalBackup' -TaskPath 'SystemMaintenance\' -ErrorAction SilentlyContinue | Select-Object TaskName, TaskPath, State

          # Clean up - remove the scheduled task
          Unregister-ScheduledTask -TaskName 'IncrementalBackup' -TaskPath 'SystemMaintenance\' -Confirm:$false -ErrorAction SilentlyContinue

          # Remove temporary files
          Remove-Item -Path $BackupTaskPath -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $BackupLogPath -Recurse -Force -ErrorAction SilentlyContinue


      - name: "Detect scheduled task creation via command-line [IT admin workflow]"
        shell: cmd
        run: |
          REM Configure scheduled task for Windows Update compliance verification
          REM Enterprise IT admin workflow for patch management automation
          set COMPLIANCESCRIPT=%TEMP%\UpdateCompliance.cmd
          set COMPLIANCELOG=%TEMP%\ComplianceLogs

          if not exist "%COMPLIANCELOG%" mkdir "%COMPLIANCELOG%"

          REM Create compliance check script
          (
            echo REM Windows Update compliance verification
            echo echo Compliance check: Windows Defender definitions >> "%COMPLIANCELOG%\compliance.log"
            echo echo Windows Update status: >> "%COMPLIANCELOG%\compliance.log"
            echo WUAUCLT /DetectNow >> "%COMPLIANCELOG%\compliance.log"
            echo echo Compliance check completed at %%DATE%% %%TIME%% >> "%COMPLIANCELOG%\compliance.log"
          ) > "%COMPLIANCESCRIPT%"

          REM Use wmic to create a scheduled task for compliance checking at logon
          wmic /namespace:\\root\\cimv2 path win32_scheduledjob call create name="ComplianceCheck",command="%COMPLIANCESCRIPT%",dayofweek="1-5"

          REM Alternative: Create task using schtasks with cmd parent (mixed tooling - realistic enterprise scenario)
          schtasks /create /tn "SystemMaintenance\UpdateCompliance" /tr "%COMPLIANCESCRIPT%" /sc onlogon /f

          REM Query task to verify creation
          schtasks /query /tn "SystemMaintenance\UpdateCompliance"

          REM Clean up
          ping localhost -n 3 > nul
          schtasks /delete /tn "SystemMaintenance\UpdateCompliance" /f
          if exist "%COMPLIANCESCRIPT%" del /f /q "%COMPLIANCESCRIPT%"
          if exist "%COMPLIANCELOG%" rmdir /s /q "%COMPLIANCELOG%"


      - name: Export and commit corpus logs
        shell: powershell
        run: |
          $exportDir = "corpus\\benign"
          $processDir = "$exportDir\\process"
          $networkDir = "$exportDir\\network"
          $registryDir = "$exportDir\\registry"
          New-Item -ItemType Directory -Force -Path $processDir, $networkDir, $registryDir | Out-Null

          # Query Sysmon EventLog and export by EventID
          $eidMap = @{
            1  = $processDir
            11 = $processDir
            3  = $networkDir
            12 = $registryDir
            13 = $registryDir
          }

          foreach ($eid in $eidMap.Keys) {
            $outFile = "$($eidMap[$eid])\\targeted_iter_002_eid${eid}.jsonl"
            try {
              Get-WinEvent -FilterHashtable @{
                LogName = "Microsoft-Windows-Sysmon/Operational"
                Id = $eid
              } -ErrorAction SilentlyContinue |
              ForEach-Object {
                $props = $_.Properties | ForEach-Object { $_.Value }
                [PSCustomObject]@{
                  Channel   = "Microsoft-Windows-Sysmon/Operational"
                  EventID   = $eid
                  TimeCreated = $_.TimeCreated.ToString("o")
                  Message   = $_.Message
                  RawProps  = ($props -join "|")
                } | ConvertTo-Json -Compress
              } | Out-File -Append -Encoding utf8 $outFile
              Write-Host "EID $eid: exported to $outFile"
            } catch {
              Write-Host "EID $eid: no events or error: $_"
            }
          }

          git config user.name "corpus-bot"
          git config user.email "corpus-bot@pipeline"
          git add corpus/benign/
          $count = (git diff --cached --name-only | Measure-Object -Line).Lines
          if ($count -gt 0) {
            git commit -m "corpus: targeted stress-test iteration iter_002 [skip ci]"
            try {
                git push
                Write-Host "Committed $count corpus files"
                } catch {
                Write-Host "git push failed: $_"
                }
          } else {
            Write-Host "No new corpus files to commit"
          }

      - name: Uninstall Sysmon
        shell: powershell
        if: always()
        run: |
          .\Sysmon\Sysmon64.exe -u force 2>$null
          Write-Host "Sysmon uninstalled"
