
permissions:
  contents: write
name: corpus-targeted-iter_002
# Auto-generated by pipeline/corpus/yaml_generator.py
# Iteration: iter_002
# Clusters: 1 | Feasible: 1 | Variants: 3
# Do not edit manually — regenerated each iteration.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-corpus:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Sysmon
        shell: powershell
        run: |
          $sysmonUrl = "https://download.sysinternals.com/files/Sysmon.zip"
          $configUrl = "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml"
          Invoke-WebRequest -Uri $sysmonUrl -OutFile Sysmon.zip
          Expand-Archive -Path Sysmon.zip -DestinationPath Sysmon
          Invoke-WebRequest -Uri $configUrl -OutFile sysmonconfig.xml
          .\Sysmon\Sysmon64.exe -accepteula -i sysmonconfig.xml
          Start-Sleep -Seconds 3
          Write-Host "Sysmon installed"
          $ts = (Get-Date).ToString("o")
          echo "CORPUS_START_TIME=$ts" >> $env:GITHUB_ENV

      # Cluster: singleton_3841934c-0ed5-4677-b96d-c2b327b347b0
      # Intent: Detect remote script download and in-memory execution via System.Net.WebClient combined with PowerShell invocation methods, particularly via LOLBin parents or direct PowerShell invocation with suspicious command-line patterns.
      # Rules: 3841934c-0ed5-4677-b96d-c2b327b347b0
      # SKIPPED variant 'IT admin workflow': blocked pattern: inline execution ('invoke-expression')
      # SKIPPED variant 'Software installer/updater workflow': blocked pattern: inline execution ('invoke-expression')
      # SKIPPED variant 'User-driven workflow': blocked pattern: inline execution ('invoke-expression')
      - name: Export and commit corpus logs
        shell: powershell
        run: |
          $exportDir   = "corpus\benign"
          $processDir  = "$exportDir\process"
          $networkDir  = "$exportDir\network"
          $registryDir = "$exportDir\registry"
          New-Item -ItemType Directory -Force -Path $processDir, $networkDir, $registryDir | Out-Null

          function Export-SysmonEvent {
              param($Event, $Eid)
              $p   = $Event.Properties
              $obj = [ordered]@{
                  Channel     = "Microsoft-Windows-Sysmon/Operational"
                  EventID     = $Eid
                  TimeCreated = $Event.TimeCreated.ToString("o")
              }
              if ($Eid -eq 1) {
                  if ($p.Count -gt 4)  { $obj["Image"]            = [string]$p[4].Value  }
                  if ($p.Count -gt 10) { $obj["CommandLine"]       = [string]$p[10].Value }
                  if ($p.Count -gt 20) { $obj["ParentImage"]       = [string]$p[20].Value }
                  if ($p.Count -gt 21) { $obj["ParentCommandLine"] = [string]$p[21].Value }
                  if ($p.Count -gt 3)  { $obj["ProcessId"]         = [string]$p[3].Value  }
                  if ($p.Count -gt 19) { $obj["ParentProcessId"]   = [string]$p[19].Value }
                  if ($p.Count -gt 12) { $obj["User"]              = [string]$p[12].Value }
                  if ($p.Count -gt 11) { $obj["CurrentDirectory"]  = [string]$p[11].Value }
                  if ($p.Count -gt 16) { $obj["IntegrityLevel"]    = [string]$p[16].Value }
                  if ($p.Count -gt 9)  { $obj["OriginalFileName"]  = [string]$p[9].Value  }
              } elseif ($Eid -eq 3) {
                  if ($p.Count -gt 4)  { $obj["Image"]               = [string]$p[4].Value  }
                  if ($p.Count -gt 6)  { $obj["Protocol"]            = [string]$p[6].Value  }
                  if ($p.Count -gt 7)  { $obj["Initiated"]           = [string]$p[7].Value  }
                  if ($p.Count -gt 9)  { $obj["SourceIp"]            = [string]$p[9].Value  }
                  if ($p.Count -gt 11) { $obj["SourcePort"]          = [string]$p[11].Value }
                  if ($p.Count -gt 14) { $obj["DestinationIp"]       = [string]$p[14].Value }
                  if ($p.Count -gt 15) { $obj["DestinationHostname"] = [string]$p[15].Value }
                  if ($p.Count -gt 16) { $obj["DestinationPort"]     = [string]$p[16].Value }
              } elseif ($Eid -eq 11) {
                  if ($p.Count -gt 4) { $obj["Image"]          = [string]$p[4].Value }
                  if ($p.Count -gt 6) { $obj["TargetFilename"] = [string]$p[6].Value }
              } elseif ($Eid -eq 12) {
                  if ($p.Count -gt 1) { $obj["EventType"]    = [string]$p[1].Value }
                  if ($p.Count -gt 5) { $obj["Image"]        = [string]$p[5].Value }
                  if ($p.Count -gt 6) { $obj["TargetObject"] = [string]$p[6].Value }
              } elseif ($Eid -eq 13) {
                  if ($p.Count -gt 1) { $obj["EventType"]    = [string]$p[1].Value }
                  if ($p.Count -gt 5) { $obj["Image"]        = [string]$p[5].Value }
                  if ($p.Count -gt 6) { $obj["TargetObject"] = [string]$p[6].Value }
                  if ($p.Count -gt 7) { $obj["Details"]      = [string]$p[7].Value }
              }
              return $obj
          }

          $startTime = if ($env:CORPUS_START_TIME) {
              [datetime]::Parse($env:CORPUS_START_TIME)
          } else {
              (Get-Date).AddMinutes(-30)
          }

          $eidMap = @{
              1  = $processDir
              11 = $processDir
              3  = $networkDir
              12 = $registryDir
              13 = $registryDir
          }

          foreach ($eid in $eidMap.Keys) {
              $outFile = "$($eidMap[$eid])\targeted_iter_002_eid$($eid).jsonl"
              try {
                  Get-WinEvent -FilterHashtable @{
                      LogName   = "Microsoft-Windows-Sysmon/Operational"
                      Id        = $eid
                      StartTime = $startTime
                  } -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      Export-SysmonEvent -Event $_ -Eid $eid | ConvertTo-Json -Compress
                  } | Out-File -Append -Encoding utf8 $outFile
                  $n = if (Test-Path $outFile) { (Get-Content $outFile | Measure-Object -Line).Lines } else { 0 }
                  Write-Host ("EID {0}: {1} events -> {2}" -f $eid, $n, $outFile)
              } catch {
                  Write-Host ("EID {0}: error - {1}" -f $eid, $_.Exception.Message)
              }
          }

          git config user.name "corpus-bot"
          git config user.email "corpus-bot@pipeline"
          git add corpus/benign/
          $count = (git diff --cached --name-only | Measure-Object -Line).Lines
          if ($count -gt 0) {
              git commit -m "corpus: targeted stress-test iteration iter_002 [skip ci]"
              try {
                  git push origin corpus/dynamically-generated
                  Write-Host "Committed $count corpus files"
              } catch {
                  Write-Host "git push failed: $_"
              }
          } else {
              Write-Host "No new corpus files to commit"
          }

      - name: Uninstall Sysmon
        shell: powershell
        if: always()
        run: |
          try { .\Sysmon\Sysmon64.exe -u force 2>&1 | Out-Null } catch {}
          Write-Host "Sysmon uninstall completed"
          exit 0
