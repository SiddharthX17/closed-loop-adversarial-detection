    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Sysmon
        shell: powershell
        run: |
          $sysmonUrl = "https://download.sysinternals.com/files/Sysmon.zip"
          $configUrl = "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml"
          Invoke-WebRequest -Uri $sysmonUrl -OutFile Sysmon.zip
          Expand-Archive -Path Sysmon.zip -DestinationPath Sysmon
          Invoke-WebRequest -Uri $configUrl -OutFile sysmonconfig.xml
          .\Sysmon\Sysmon64.exe -accepteula -i sysmonconfig.xml
          Start-Sleep -Seconds 3
          Write-Host "Sysmon installed"
          $ts = (Get-Date).ToString("o")
          echo "CORPUS_START_TIME=$ts" >> $env:GITHUB_ENV

      # Cluster: singleton_5ae089ac-a459-41a7-b3ea-6139056f6b44
      # Intent: Detect unauthorized memory dumps of LSASS process using living-off-the-land binaries (LOLBins) and credential dumping tools to extract cached credentials.
      # Rules: 5ae089ac-a459-41a7-b3ea-6139056f6b44
      - name: "Detect unauthorized memory dumps of LSASS process [IT admin workflow]"
        shell: powershell
        run: |
          # Simulate legitimate diagnostic memory dump collection for Kerberos auth troubleshooting
          $diagPath = Join-Path $env:TEMP "Diagnostics_$(Get-Random)"
          New-Item -ItemType Directory -Path $diagPath -Force | Out-Null

          try {
            # Verify procdump availability; use dummy invocation if not present
            $produmpExe = "procdump.exe"
            $lsassPid = (Get-Process -Name lsass -ErrorAction SilentlyContinue | Select-Object -First 1).Id

            if ($lsassPid) {
              # Legitimate admin diagnostic: capture minidump for Kerberos analysis
              Write-Output "[$(Get-Date)] Collecting LSASS diagnostic dump for authentication service review"
              & cmd /c "echo Diagnostic collection initiated" > "$diagPath\collection_log.txt"

              # Simulate procdump invocation with realistic parameters
              # Real usage: procdump.exe -ma -n 1 <pid> <output_path>
              # We reference the tool name in command as would appear in real admin script
              $dumpCmd = "procdump.exe -ma -n 1 $lsassPid \"$diagPath\minidump.dmp\""
              Write-Output "[$(Get-Date)] Executing memory dump collection: $dumpCmd"

              # Create a placeholder dump file to simulate tool output
              $dumpContent = @()
              $dumpContent += "Process ID: $lsassPid"
              $dumpContent += "Dump Type: Full Memory (-ma)"
              $dumpContent += "Creation Time: $(Get-Date)"
              $dumpContent += "Purpose: Kerberos authentication diagnostics"
              $dumpContent | Out-File -FilePath "$diagPath\minidump.dmp" -Encoding ASCII

              # Verify collection
              Write-Output "[$(Get-Date)] Dump file created: $(Test-Path \"$diagPath\minidump.dmp\")"
            }
            else {
              Write-Output "LSASS process not found; skipping dump collection"
            }
          }
          finally {
            # Cleanup diagnostic artifacts
            if (Test-Path $diagPath) {
              Remove-Item -Path $diagPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Output "[$(Get-Date)] Cleaned up diagnostic directory: $diagPath"
            }
          }

      - name: "Detect unauthorized memory dumps of LSASS process [User-driven workflow]"
        shell: cmd
        run: |
          @echo off
          REM User-initiated system diagnostics collection script
          setlocal enabledelayedexpansion

          REM Create working directory for diagnostic outputs
          set DIAGDIR=%APPDATA%\Local\Temp\SystemDiag_%RANDOM%
          if not exist "%DIAGDIR%" mkdir "%DIAGDIR%"

          echo [%date% %time%] Starting system diagnostics collection >> "%DIAGDIR%\diagnostic.log"

          REM Document current process context
          echo Parent Process: cmd.exe >> "%DIAGDIR%\diagnostic.log"
          echo Working Directory: %CD% >> "%DIAGDIR%\diagnostic.log"

          REM Reference rundll32 and comsvcs in command context (as real admin scripts do)
          echo [%date% %time%] Preparing rundll32 invocation for kernel debugging >> "%DIAGDIR%\diagnostic.log"
          echo Command Template: rundll32.exe comsvcs.dll MiniDumpW /p ^<process_id^> /fullmemdmp /o >> "%DIAGDIR%\diagnostic.log"

          REM Query LSASS process info for diagnostic purposes
          for /f "tokens=2" %%A in ('tasklist /FI "IMAGENAME eq lsass.exe" /FO LIST ^| find /I "pid"') do (
            set LSASS_PID=%%A
            echo LSASS PID identified: !LSASS_PID! >> "%DIAGDIR%\diagnostic.log"
            echo [%date% %time%] Full memory dump requested: fullmemdmp parameter >> "%DIAGDIR%\diagnostic.log"
          )

          REM Simulate rundll32/comsvcs method reference (documenting approach, not executing)
          echo [%date% %time%] Diagnostic outputs directory: %DIAGDIR% >> "%DIAGDIR%\diagnostic.log"

          REM Create sample diagnostic file
          echo System Diagnostics Report > "%DIAGDIR%\sysinfo.txt"
          echo Generated: %date% %time% >> "%DIAGDIR%\sysinfo.txt"
          echo LSASS status check completed >> "%DIAGDIR%\sysinfo.txt"

          echo [%date% %time%] Diagnostics collection complete >> "%DIAGDIR%\diagnostic.log"

          REM Cleanup phase
          echo [%date% %time%] Removing diagnostic artifacts from %DIAGDIR%
          timeout /t 1 /nobreak > nul
          if exist "%DIAGDIR%" (
            del /q "%DIAGDIR%\*.txt" 2>nul
            del /q "%DIAGDIR%\*.log" 2>nul
            rmdir /q "%DIAGDIR%" 2>nul
            echo Diagnostic directory cleaned up
          )

          endlocal

      - name: "Detect unauthorized memory dumps of LSASS process [IT admin workflow]"
        shell: powershell
        run: |
          # VBScript diagnostic collection initiated by admin
          $vbscriptPath = Join-Path $env:TEMP "SystemDiag_$(Get-Random).vbs"
          $outputDir = Join-Path $env:USERPROFILE "Downloads"

          $vbscriptContent = @'
          Set objFSO = CreateObject("Scripting.FileSystemObject")
          Set objShell = CreateObject("WScript.Shell")

          logFile = objFSO.BuildPath(objShell.ExpandEnvironmentStrings("%USERPROFILE%\Downloads"), "diagnostic_" & Int(Rnd * 10000) & ".log")

          Set objFile = objFSO.CreateTextFile(logFile, True)
          objFile.WriteLine "System Diagnostic Collection Log"
          objFile.WriteLine "Generated: " & Now
          objFile.WriteLine "Process: cscript.exe"
          objFile.WriteLine ""
          objFile.WriteLine "Diagnostic Parameters:"
          objFile.WriteLine "  - Memory dump type: minidump"
          objFile.WriteLine "  - Target process: lsass"
          objFile.WriteLine "  - Dump flags: /fullmemdmp"
          objFile.WriteLine "  - Output path: " & logFile
          objFile.WriteLine ""
          objFile.WriteLine "Execution context for #24 hash symbol processing"
          objFile.WriteLine "Reference code #65560 for memory enumeration protocol"
          objFile.WriteLine ""
          objFile.WriteLine "Diagnostic collection completed at: " & Now
          objFile.Close

          ' + "WScript.Echo \"Diagnostic log created: \" & logFile

          '@

          try {
            # Write the VBScript to temp location
            Set-Content -Path $vbscriptPath -Value $vbscriptContent -Encoding ASCII

            Write-Output "[$(Get-Date)] Executing administrative diagnostic script"
            Write-Output "[$(Get-Date)] Parent process: powershell.exe"
            Write-Output "[$(Get-Date)] Child process: cscript.exe"
            Write-Output "[$(Get-Date)] Script path: $vbscriptPath"

            # Execute VBScript in current context
            & cscript.exe "$vbscriptPath" 2>&1 | ForEach-Object {
              Write-Output "[$(Get-Date)] $($_)"
            }

            # Verify diagnostic output in Downloads folder
            $diagFiles = @(Get-ChildItem -Path $outputDir -Filter "diagnostic_*.log" -ErrorAction SilentlyContinue)
            Write-Output "[$(Get-Date)] Diagnostic files created: $($diagFiles.Count)"

            # Cleanup diagnostic files from Downloads
            foreach ($file in $diagFiles) {
              if ($file.CreationTime -gt (Get-Date).AddMinutes(-5)) {
                Remove-Item -Path $file.FullName -Force -ErrorAction SilentlyContinue
                Write-Output "[$(Get-Date)] Removed diagnostic artifact: $($file.Name)"
              }
            }
          }
          finally {
            # Cleanup VBScript
            if (Test-Path $vbscriptPath) {
              Remove-Item -Path $vbscriptPath -Force -ErrorAction SilentlyContinue
              Write-Output "[$(Get-Date)] Removed script file: $vbscriptPath"
            }
          }

      - name: Export and commit corpus logs
        shell: powershell
        run: |
          $exportDir   = "corpus\benign"
          $processDir  = "$exportDir\process"
          $networkDir  = "$exportDir\network"
          $registryDir = "$exportDir\registry"
          New-Item -ItemType Directory -Force -Path $processDir, $networkDir, $registryDir | Out-Null

          function Export-SysmonEvent {
              param($Event, $Eid)
              $p   = $Event.Properties
              $obj = [ordered]@{
                  Channel     = "Microsoft-Windows-Sysmon/Operational"
                  EventID     = $Eid
                  TimeCreated = $Event.TimeCreated.ToString("o")
              }
              if ($Eid -eq 1) {
                  if ($p.Count -gt 4)  { $obj["Image"]            = [string]$p[4].Value  }
                  if ($p.Count -gt 10) { $obj["CommandLine"]       = [string]$p[10].Value }
                  if ($p.Count -gt 20) { $obj["ParentImage"]       = [string]$p[20].Value }
                  if ($p.Count -gt 21) { $obj["ParentCommandLine"] = [string]$p[21].Value }
                  if ($p.Count -gt 3)  { $obj["ProcessId"]         = [string]$p[3].Value  }
                  if ($p.Count -gt 19) { $obj["ParentProcessId"]   = [string]$p[19].Value }
                  if ($p.Count -gt 12) { $obj["User"]              = [string]$p[12].Value }
                  if ($p.Count -gt 11) { $obj["CurrentDirectory"]  = [string]$p[11].Value }
                  if ($p.Count -gt 16) { $obj["IntegrityLevel"]    = [string]$p[16].Value }
                  if ($p.Count -gt 9)  { $obj["OriginalFileName"]  = [string]$p[9].Value  }
              } elseif ($Eid -eq 3) {
                  if ($p.Count -gt 4)  { $obj["Image"]               = [string]$p[4].Value  }
                  if ($p.Count -gt 6)  { $obj["Protocol"]            = [string]$p[6].Value  }
                  if ($p.Count -gt 7)  { $obj["Initiated"]           = [string]$p[7].Value  }
                  if ($p.Count -gt 9)  { $obj["SourceIp"]            = [string]$p[9].Value  }
                  if ($p.Count -gt 11) { $obj["SourcePort"]          = [string]$p[11].Value }
                  if ($p.Count -gt 14) { $obj["DestinationIp"]       = [string]$p[14].Value }
                  if ($p.Count -gt 15) { $obj["DestinationHostname"] = [string]$p[15].Value }
                  if ($p.Count -gt 16) { $obj["DestinationPort"]     = [string]$p[16].Value }
              } elseif ($Eid -eq 11) {
                  if ($p.Count -gt 4) { $obj["Image"]          = [string]$p[4].Value }
                  if ($p.Count -gt 6) { $obj["TargetFilename"] = [string]$p[6].Value }
              } elseif ($Eid -eq 12) {
                  if ($p.Count -gt 1) { $obj["EventType"]    = [string]$p[1].Value }
                  if ($p.Count -gt 5) { $obj["Image"]        = [string]$p[5].Value }
                  if ($p.Count -gt 6) { $obj["TargetObject"] = [string]$p[6].Value }
              } elseif ($Eid -eq 13) {
                  if ($p.Count -gt 1) { $obj["EventType"]    = [string]$p[1].Value }
                  if ($p.Count -gt 5) { $obj["Image"]        = [string]$p[5].Value }
                  if ($p.Count -gt 6) { $obj["TargetObject"] = [string]$p[6].Value }
                  if ($p.Count -gt 7) { $obj["Details"]      = [string]$p[7].Value }
              }
              return $obj
          }

          $startTime = if ($env:CORPUS_START_TIME) {
              [datetime]::Parse($env:CORPUS_START_TIME)
          } else {
              (Get-Date).AddMinutes(-30)
          }

          $eidMap = @{
              1  = $processDir
              11 = $processDir
              3  = $networkDir
              12 = $registryDir
              13 = $registryDir
          }

          foreach ($eid in $eidMap.Keys) {
              $outFile = "$($eidMap[$eid])\targeted_iter_002_eid$($eid).jsonl"
              try {
                  Get-WinEvent -FilterHashtable @{
                      LogName   = "Microsoft-Windows-Sysmon/Operational"
                      Id        = $eid
                      StartTime = $startTime
                  } -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      Export-SysmonEvent -Event $_ -Eid $eid | ConvertTo-Json -Compress
                  } | Out-File -Append -Encoding utf8 $outFile
                  $n = if (Test-Path $outFile) { (Get-Content $outFile | Measure-Object -Line).Lines } else { 0 }
                  Write-Host ("EID {0}: {1} events -> {2}" -f $eid, $n, $outFile)
              } catch {
                  Write-Host ("EID {0}: error - {1}" -f $eid, $_.Exception.Message)
              }
          }

          git config user.name "corpus-bot"
          git config user.email "corpus-bot@pipeline"
          git add corpus/benign/
          $count = (git diff --cached --name-only | Measure-Object -Line).Lines
          if ($count -gt 0) {
              git commit -m "corpus: targeted stress-test iteration iter_002 [skip ci]"
              try {
                  git push origin corpus/dynamically-generated
                  Write-Host "Committed $count corpus files"
              } catch {
                  Write-Host "git push failed: $_"
              }
          } else {
              Write-Host "No new corpus files to commit"
          }

      - name: Uninstall Sysmon
        shell: powershell
        if: always()
        run: |
          try { .\Sysmon\Sysmon64.exe -u force 2>&1 | Out-Null } catch {}
          Write-Host "Sysmon uninstall completed"
          exit 0
