version: 1
fields:
  timestamp:           { type: str, required: true,  description: "ISO 8601" }
  host:                { type: str, required: true,  description: "hostname" }
  user:                { type: str, required: true,  description: "username or SYSTEM" }
  EventID:             { type: int, required: true,  description: "Windows Event ID" }
  event_type:          { type: str, required: true,  description: "process_creation | registry | network | auth" }
  Image:               { type: str, required: false, description: "full image path" }
  CommandLine:         { type: str, required: false, description: "full command line" }
  ParentImage:         { type: str, required: false }
  ParentCommandLine:   { type: str, required: false }
  ProcessId:           { type: str, required: false }
  ParentProcessId:     { type: str, required: false }
  TargetObject:        { type: str, required: false, description: "registry key path" }
  Details:             { type: str, required: false, description: "registry value data" }
  SourceIp:            { type: str, required: false }
  DestinationIp:       { type: str, required: false }
  DestinationHostname: { type: str, required: false }
  DestinationPort:     { type: int, required: false }
  OriginalFileName:  { type: str, required: false, description: "PE header original filename — catches renamed binaries" }
  CurrentDirectory:  { type: str, required: false, description: "working directory at process launch" }
  IntegrityLevel:    { type: str, required: false, description: "process integrity level" }
  Protocol:          { type: str, required: false, description: "network protocol tcp/udp — EID 3" }
  Initiated:         { type: str, required: false, description: "true if process initiated connection — EID 3" }