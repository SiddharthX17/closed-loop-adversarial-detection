# Target ATT&CK techniques for v1 emulation.
#
# Format: list of ATT&CK technique IDs (subtechniques supported e.g. T1059.001)
# The emulator reads this file when technique_ids is not passed explicitly.

techniques:
  - T1059.001 # Command and Scripting Interpreter: PowerShell
  
  - T1053.005 # Scheduled Task/Job: Scheduled Task

  - T1036.005 # Masquerading: Match Legitimate Resource Name or Location

  - T1003.001 # OS Credential Dumping: LSASS Memory

  - T1567.003 # Exfiltration Over Web Service: Exfiltration to Text Storage Sites
  