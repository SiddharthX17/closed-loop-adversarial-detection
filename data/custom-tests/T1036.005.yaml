attack_technique: T1036.005
display_name: "Masquerading: Match Legitimate Resource Name or Location - Custom"

atomic_tests:
- name: Cmd Renamed as SecurityHealthHost
  auto_generated_guid: c923e0a9-059e-4dd9-b938-0a5c0d7fa7d4
  description: |
    Copy cmd.exe to a Windows-like security binary name and execute it.
  supported_platforms:
  - windows
  input_arguments:
    fake_bin:
      type: path
      default: C:\Users\Public\SecurityHealthHost.exe
  executor:
    name: command_prompt
    command: |
      copy C:\Windows\System32\cmd.exe "#{fake_bin}" && "#{fake_bin}" /c whoami
    cleanup_command: |
      del "#{fake_bin}" >nul 2>nul

