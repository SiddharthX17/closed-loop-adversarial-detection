- name: Wscript Renamed as DefenderUpdate
  auto_generated_guid: 2e9f7f11-6666-4b61-9001-b66666666666
  description: |
    Copy wscript.exe to a Microsoft security themed filename and execute it to emulate legitimate-name masquerading.
  supported_platforms:
  - windows
  input_arguments:
    fake_bin:
      type: path
      default: C:\Users\Public\MpCmdUpdate.exe
  executor:
    name: command_prompt
    command: |
      copy C:\Windows\System32\wscript.exe "#{fake_bin}" && "#{fake_bin}" //B C:\Windows\System32\Printing_Admin_Scripts\en-US\prnmngr.vbs
    cleanup_command: |
      del "#{fake_bin}" >nul 2>nul