attack_technique: T1036.005
display_name: "Masquerading: Match Legitimate Resource Name or Location"

atomic_tests:
- name: Cmd Renamed as SecurityHealthHost
  auto_generated_guid: 2e9f7f11-1111-4b61-9001-b11111111111
  description: |
    Copy cmd.exe to a Windows-like security binary name and execute it.
  supported_platforms:
  - windows
  input_arguments:
    fake_bin:
      type: path
      default: C:\Users\Public\SecurityHealthHost.exe
  executor:
    name: command_prompt
    command: |
      copy C:\Windows\System32\cmd.exe "#{fake_bin}" && "#{fake_bin}" /c whoami
    cleanup_command: |
      del "#{fake_bin}" >nul 2>nul

- name: PowerShell Renamed as OneDriveUpdater
  auto_generated_guid: 2e9f7f11-2222-4b61-9001-b22222222222
  description: |
    Masquerade powershell.exe as OneDrive updater.
  supported_platforms:
  - windows
  input_arguments:
    fake_bin:
      type: path
      default: C:\ProgramData\OneDriveUpdater.exe
  executor:
    name: command_prompt
    command: |
      copy C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe "#{fake_bin}" && "#{fake_bin}" -c hostname
    cleanup_command: |
      del "#{fake_bin}" >nul 2>nul

