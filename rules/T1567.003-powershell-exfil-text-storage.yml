title: PowerShell Exfiltration to Text Storage Site
id: 1b22893d-855c-4792-a375-5071d53f0d42
status: experimental
description: >
  Detects PowerShell using Invoke-RestMethod or Invoke-WebRequest to POST data
  to known text storage sites (pastebin.com, paste.ee, hastebin.com).
  Indicative of exfiltration via T1567.003.
references:
  - https://attack.mitre.org/techniques/T1567/003/
  - https://web.archive.org/web/20201107203304/https://www.echosec.net/blog/what-is-pastebin-and-why-do-hackers-love-it
author: custom
date: 2026-04-16
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|contains:
      - 'powershell.exe'
      - 'pwsh.exe'
  selection_cmdline:
    CommandLine|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'ghostbin.com'
  selection_method:
    CommandLine|contains:
      - 'Invoke-RestMethod'
      - 'Invoke-WebRequest'
      - 'iwr '
      - 'irm '
      - 'curl '
      - 'wget '
  condition: selection_process and selection_cmdline and selection_method
falsepositives:
  - Unlikely in enterprise environments
level: high