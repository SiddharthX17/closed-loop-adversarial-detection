title: LSASS Memory Dump via rdrleakdiag.exe with Full Memory Dump Flag
id: abf62430-d14c-4519-9d75-25daec01a6a9
status: experimental
description: |
    Detects abuse of the Windows diagnostic tool rdrleakdiag.exe to perform a full memory dump,
    which can be used to extract credential material from LSASS. The /fullmemdmp argument combined
    with rdrleakdiag.exe has no legitimate enterprise use and is a high-fidelity indicator of
    credential dumping activity (T1003.001).
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://www.deepinstinct.com/blog/lsass-memory-dumps-are-stealthier-than-ever-before
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'rdrleakdiag'
            - '/fullmemdmp'
    condition: selection
falsepositives:
    - Microsoft support engineers performing authorized diagnostic memory captures under documented change-control scenarios (extremely rare in enterprise environments)
level: critical