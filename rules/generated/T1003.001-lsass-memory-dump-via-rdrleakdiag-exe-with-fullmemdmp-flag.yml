title: LSASS Memory Dump via rdrleakdiag.exe with /fullmemdmp Flag
id: 41354e3f-eeac-40c9-a0d7-d159533bb4b6
status: experimental
description: |
    Detects abuse of the Microsoft-signed rdrleakdiag.exe diagnostic binary to dump LSASS process memory
    using the /fullmemdmp flag. This LOLBin technique allows attackers to extract credential material
    from LSASS memory while evading controls that block unsigned or known offensive tools.
    The combination of rdrleakdiag.exe, /fullmemdmp, and lsass in the command line has no legitimate
    enterprise use case and represents a near-zero false positive detection.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://lolbas-project.github.io/lolbas/Binaries/Rdrleakdiag/
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rdrleakdiag.exe'
        CommandLine|contains|all:
            - '/fullmemdmp'
            - 'lsass'
    condition: selection
falsepositives:
    - No known legitimate use case combines rdrleakdiag.exe with /fullmemdmp targeting lsass
    - Microsoft support-assisted diagnostics do not target lsass with /fullmemdmp
level: critical