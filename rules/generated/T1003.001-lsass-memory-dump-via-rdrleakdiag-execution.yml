title: LSASS Memory Dump via rdrleakdiag Execution
id: b2395fb9-cc0b-48e9-a579-b9baeacae621
status: experimental
description: |
    Detects the use of rdrleakdiag.exe (or renamed copies) to dump LSASS memory.
    Attackers copy or invoke rdrleakdiag.exe with /fullmemdmp to extract LSASS process memory
    for credential harvesting. This covers both direct execution and execution via rundll32 ShellExec.
references:
    - https://www.deepinstinct.com/blog/lsass-memory-dumping-with-rdrleakdiag
    - https://attack.mitre.org/techniques/T1003/001/
author: Detection Engineer
date: 2026-06-16
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_rdrleakdiag_direct:
        CommandLine|contains|all:
            - 'rdrleakdiag'
            - '/fullmemdmp'
    selection_rdrleakdiag_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'rdrleakdiag'
            - '/fullmemdmp'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of rdrleakdiag.exe for Windows diagnostic memory leak analysis (rare in enterprise environments)
level: high