title: LSASS Memory Dump via User-Writable Path Binary with LSASS PID Resolution in Parent
id: c4dd5877-1471-4762-ac8e-171cc9798b01
status: experimental
description: |
    Detects process creation events where a binary executing from a user-writable directory
    (Public, AppData, Temp, Downloads, ProgramData) is spawned by a parent command line that
    explicitly identifies the LSASS process by name in an enumeration context. This pattern
    is structurally required when an attacker uses a renamed or custom dump tool to target
    LSASS memory: the attacker must resolve the LSASS PID before invoking the dump binary.
    Covers T1003.001 regardless of the specific dump tool used, surviving binary renaming
    and flag reordering.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_user_writable_image:
        Image|contains:
            - '\Users\Public\'
            - '\Users\Default\'
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\AppData\Local\'
            - '\ProgramData\'
            - '\Windows\Temp\'
            - '\Temp\'
            - '\Downloads\'
            - '\Desktop\'
    selection_parent_lsass_enum:
        ParentCommandLine|contains:
            - 'lsass'
    selection_parent_enum_context:
        ParentCommandLine|contains:
            - 'Get-Process'
            - 'OpenProcess'
            - 'tasklist'
            - 'wmic process'
            - 'Get-WmiObject'
            - 'ForEach-Object'
            - 'foreach'
    filter_system_paths:
        Image|contains:
            - '\Windows\System32\'
            - '\Windows\SysWOW64\'
            - '\Program Files\'
            - '\Program Files (x86)\'
    condition: all of selection_* and not filter_system_paths
falsepositives:
    - EDR or security tooling that enumerates lsass by name in a parent command line and
      spawns child processes from non-standard paths. Mitigate by adding known security
      vendor Image paths to the filter.
    - Legitimate diagnostic scripts that reference lsass in a monitoring context and invoke
      tools from user directories. Review ParentCommandLine and Image path for legitimacy.
level: high