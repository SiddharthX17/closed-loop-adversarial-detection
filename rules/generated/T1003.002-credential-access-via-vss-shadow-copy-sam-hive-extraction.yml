title: Credential Access via VSS Shadow Copy SAM Hive Extraction
id: f4f5f1f2-c7c7-4290-850a-54464de8bade
status: experimental
description: Detects processes accessing Windows credential hive files (SAM, SYSTEM, SECURITY) through Volume Shadow Copy Service device paths, which is a common technique to bypass OS file locks and extract password hashes offline.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.t1003.002
  - attack.credential_access
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_path:
    CommandLine|contains: 'HarddiskVolumeShadowCopy'
  selection_hive_files:
    - CommandLine|contains: '\config\SAM'
    - CommandLine|contains: '\config\SYSTEM'
    - CommandLine|contains: '\config\SECURITY'
  filter_backup_agents:
    - Image|contains:
        - 'Veeam'
        - 'BackupExec'
        - 'WindowsImageBackup'
        - 'Backup Exec'
    - Image|startswith:
        - 'C:\Program Files\Veeam\'
        - 'C:\Program Files (x86)\Veeam\'
        - 'C:\Program Files\Veritas\'
        - 'C:\Program Files (x86)\Veritas\'
        - 'C:\Program Files\Windows Server Backup\'
  condition: selection_vss_path and 1 of selection_hive_files and not 1 of filter_backup_agents
falsepositives:
  - Enterprise backup and disaster recovery software accessing VSS copies via raw device paths
  - IT administrator VSS inspection scripts (baseline and allowlist known administrative scripts)
  - Antivirus or EDR shadow copy scanning agents
level: high