title: Credential Hive Access via Volume Shadow Copy Device Path
id: 616ed38e-0965-4b1c-a016-7b87b6361a86
status: experimental
description: Detects attempts to copy locked Windows credential hive files (SAM, SYSTEM, SECURITY, NTDS) from Volume Shadow Copy snapshots using the GLOBALROOT device path, a technique used to bypass OS file locks for offline credential extraction.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_path:
    CommandLine|contains: '\GLOBALROOT\Device\HarddiskVolumeShadowCopy'
  selection_hive_files:
    CommandLine|contains:
      - 'config\SAM'
      - 'config\SYSTEM'
      - 'config\SECURITY'
      - 'config\NTDS'
  filter_backup_agents:
    Image|contains:
      - '\Program Files\Veeam\'
      - '\Program Files\Veritas\'
      - '\Program Files\BackupExec\'
      - '\Program Files\Windows Server Backup\'
      - '\Program Files (x86)\Veeam\'
      - '\Program Files (x86)\Veritas\'
  condition: selection_vss_path and selection_hive_files and not filter_backup_agents
falsepositives:
  - Enterprise backup software using VSS device paths in command-line visible operations (filter by known backup agent Image paths)
  - IT administrator scripts for manual backup or disaster recovery testing
level: high