title: Credential Hive Access via Volume Shadow Copy Device Path
id: acd1829a-c9ce-44fe-920a-9c836b34879c
status: experimental
description: Detects any process whose command line references the VSS device namespace path combined with a Windows credential hive name (SAM, SYSTEM, or SECURITY), indicating an attempt to copy locked registry hives via shadow copies to extract credential material.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_path:
    CommandLine|contains: 'HarddiskVolumeShadowCopy'
  selection_hive:
    CommandLine|contains:
      - 'config\SAM'
      - 'config\SYSTEM'
      - 'config\SECURITY'
  condition: selection_vss_path and selection_hive
falsepositives:
  - Enterprise backup software that passes raw VSS device paths as command-line arguments (rare; backup agents typically use VSS COM APIs rather than command-line string construction targeting credential hives)
level: high