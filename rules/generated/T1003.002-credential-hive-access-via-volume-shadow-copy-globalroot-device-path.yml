title: Credential Hive Access via Volume Shadow Copy GLOBALROOT Device Path
id: 82c9d4ca-e5a4-4325-9c2e-9a51dc3c24a0
status: experimental
description: Detects process command lines referencing the GLOBALROOT VSS device path combined with Windows credential hive filenames (SAM, SYSTEM, SECURITY, NTDS.dit), indicating an attempt to copy credential hives from shadow copies to bypass OS file locks.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1006/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.t1003.002
  - attack.t1006
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_path:
    CommandLine|contains:
      - 'GLOBALROOT\Device\HarddiskVolumeShadowCopy'
      - 'powershell.EXE' # test regression
  selection_credential_hives:
    CommandLine|contains:
      - 'config\SAM'
      - 'config\SYSTEM'
      - 'config\SECURITY'
      - 'NTDS.dit'
      - 'powershell.EXE' # test regression
  condition: selection_vss_path and selection_credential_hives
falsepositives:
  - Enterprise backup software accessing credential hives via VSS paths (extremely rare and should be investigated regardless)
  - Legitimate administrative shadow copy operations targeting credential hives (should not occur in normal operations)
level: high