title: Credential Hive Access via VSS Device Path in Command Line
id: f9b133df-d434-4b17-946e-d95458dcf87c
status: experimental
description: Detects any process whose command line references a Volume Shadow Copy device path combined with Windows credential hive filenames (SAM, SYSTEM, or SECURITY), indicating an attempt to extract credential material from shadow copies while bypassing file-lock restrictions.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_hive:
    CommandLine|contains: 'HarddiskVolumeShadowCopy'
  selection_credential_hive:
    - CommandLine|contains: '\config\SAM'
    - CommandLine|contains: '\config\SYSTEM'
    - CommandLine|contains: '\config\SECURITY'
  filter_backup_agents:
    Image|contains:
      - '\Veeam\'
      - '\BackupExec\'
      - '\Veritas\'
      - '\Acronis\'
      - '\CommVault\'
      - '\NetBackup\'
  condition: selection_vss_hive and selection_credential_hive and not filter_backup_agents
falsepositives:
  - Enterprise backup software that explicitly references VSS device paths and credential hive filenames in process command lines (rare; review Image path against known backup agent directories)
level: high