title: SAM Hive Credential Theft via Volume Shadow Copy Device Path
id: 1dee9b81-389f-4a47-9112-702c7c89ec01
status: experimental
description: Detects any process whose command line references a VSS shadow copy device path combined with the SAM hive path, indicating an attempt to copy the locked SAM file via Volume Shadow Copy to extract credential hashes.
references:
  - https://attack.mitre.org/techniques/T1003/002/
tags:
  - attack.credential_access
  - attack.t1003.002
author: Detection Engineer
date: 2024-01-01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
      - 'HarddiskVolumeShadowCopy'
      - '\config\SAM'
  condition: selection
falsepositives:
  - Enterprise backup software accessing VSS snapshots (these agents typically invoke VSS via API, not command-line arguments referencing the SAM hive path directly)
  - IT recovery scripts targeting shadow copies (legitimate scripts will not reference the SAM hive path alongside a VSS device path)
level: high