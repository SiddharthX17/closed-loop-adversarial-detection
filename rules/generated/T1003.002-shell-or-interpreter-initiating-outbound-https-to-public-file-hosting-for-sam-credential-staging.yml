title: Shell or Interpreter Initiating Outbound HTTPS to Public File Hosting for SAM Credential Staging
id: 86404854-1773-4a92-87b4-ac08c7a9c07d
status: experimental
description: >
  Detects shell or scripting interpreter processes initiating outbound HTTPS connections
  to public file-hosting and code-distribution services commonly used to stage credential
  dumping tools. This targets the tool-staging step that precedes SAM database access
  (T1003.002), where an attacker downloads a harvesting utility from a public repository
  before executing it locally.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://thedfirreport.com/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: network_connection
  product: windows
detection:
  selection_initiator:
    Initiated: 'true'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_destination:
    DestinationHostname|contains:
      - 'raw.githubusercontent.com'
      - 'pastebin.com'
      - 'transfer.sh'
      - 'paste.ee'
      - 'cdn.discordapp.com'
      - 'ghostbin.com'
      - 'hastebin.com'
      - 'controlc.com'
      - 'paste.nrecom.net'
      - 'filebin.net'
      - 'temp.sh'
      - 'gofile.io'
    DestinationPort: 443
  filter_ide_parents:
    ParentImage|endswith:
      - '\devenv.exe'
      - '\code.exe'
      - '\rider64.exe'
      - '\idea64.exe'
      - '\pycharm64.exe'
      - '\webstorm64.exe'
      - '\clion64.exe'
      - '\goland64.exe'
      - '\eclipse.exe'
      - '\netbeans64.exe'
  filter_package_managers:
    Image|contains:
      - '\chocolatey\'
      - '\scoop\'
      - '\winget\'
      - '\npm\'
      - '\node_modules\'
  filter_update_parents:
    ParentImage|endswith:
      - '\TrustedInstaller.exe'
      - '\wusa.exe'
      - '\msiexec.exe'
      - '\svchost.exe'
  condition: (selection_initiator and selection_destination) and not (filter_ide_parents or filter_package_managers or filter_update_parents)
falsepositives:
  - Developer workflows using shell scripts to fetch content from GitHub raw URLs
  - IT automation and administrative scripts contacting public repositories
  - CI/CD agents running on endpoints that invoke shell processes to download artifacts
  - Legitimate software update mechanisms using PowerShell to retrieve content
level: medium