title: VSS GLOBALROOT Device Path Used to Access Credential Hive Files
id: 9770e8e9-31e4-424f-a6e6-42a1bf135b61
status: experimental
description: Detects process creation events where the command line references the VSS GLOBALROOT device namespace path combined with a Windows credential hive filename (SAM, SYSTEM, or SECURITY). This combination is structurally required for VSS-based credential hive theft and is not produced by legitimate administrative tooling in normal enterprise operations.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dumping-hashes-from-sam-registry
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss_path:
    CommandLine|contains: 'GLOBALROOT\Device\HarddiskVolumeShadowCopy'
  selection_hive_files:
    CommandLine|contains:
      - '\config\SAM'
      - '\config\SYSTEM'
      - '\config\SECURITY'
  filter_backup_agents:
    Image|contains:
      - '\Veeam\'
      - '\ArcServe\'
      - '\BackupExec\'
      - '\Veritas\'
      - '\CommVault\'
      - '\NetBackup\'
      - '\TSM\'
      - '\Tivoli\'
  condition: selection_vss_path and selection_hive_files and not filter_backup_agents
falsepositives:
  - Incident response and forensic tooling (FTK, Velociraptor, custom IR scripts) run by named IR operator accounts
  - Enterprise backup agents that reference VSS device paths in command-line arguments rather than via VSS API
level: high