title: VSS Shadow Copy Access to Credential Registry Hives
id: fb12b703-e9ea-4041-82c4-556fd7ec946f
status: experimental
description: Detects any process referencing a VSS shadow copy device path combined with a Windows credential registry hive path (SAM, SYSTEM, or SECURITY), indicating an attempt to extract credential material by bypassing file-lock restrictions via Volume Shadow Copy.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.t1003.002
  - attack.credential_access
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss:
    CommandLine|contains: 'HarddiskVolumeShadowCopy'
  selection_hive:
    CommandLine|contains:
      - '\config\SAM'
      - '\config\SYSTEM'
      - '\config\SECURITY'
  filter_backup_veeam:
    Image|contains: 'Veeam'
  filter_backup_veritas:
    Image|contains:
      - 'Veritas'
      - 'BackupExec'
  filter_backup_wsb:
    Image|contains: 'Windows Server Backup'
  condition: selection_vss and selection_hive and not (filter_backup_veeam or filter_backup_veritas or filter_backup_wsb)
falsepositives:
  - Enterprise backup and disaster recovery agents that access VSS paths via command-line arguments (extremely rare for credential hive paths)
level: high