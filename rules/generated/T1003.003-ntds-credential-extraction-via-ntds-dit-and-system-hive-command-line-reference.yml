title: NTDS Credential Extraction via ntds.dit and SYSTEM Hive Command Line Reference
id: 68b93737-9170-4701-b799-0fbc049ff663
status: experimental
description: >
  Detects processes whose command line references both ntds.dit and the SYSTEM hive
  (config\SYSTEM or SYSTEM_HIVE), indicating paired credential material staging for
  offline NTDS decryption. This technique-level invariant covers any tool or wrapper
  used to copy NTDS artifacts outside of known backup tooling.
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_ntds:
    CommandLine|contains: 'ntds.dit'
  selection_system_hive:
    - CommandLine|contains: 'config\SYSTEM'
    - CommandLine|contains: 'SYSTEM_HIVE'
    - CommandLine|contains: 'SYSTEM hive'
  filter_backup_agents:
    Image|endswith:
      - '\wbadmin.exe'
      - '\vssadmin.exe'
      - '\diskshadow.exe'
      - '\ntbackup.exe'
  condition: selection_ntds and selection_system_hive and not filter_backup_agents
falsepositives:
  - Legitimate backup software (Veeam, Commvault, Windows Server Backup) referencing
    ntds.dit and the SYSTEM hive simultaneously. Filter by known backup agent Image paths.
  - VSS or snapshot operations referencing NTDS paths in scheduled backup context.
level: critical