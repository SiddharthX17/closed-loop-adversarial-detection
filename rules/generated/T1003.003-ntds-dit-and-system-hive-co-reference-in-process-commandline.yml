title: NTDS.dit and SYSTEM Hive Co-Reference in Process CommandLine
id: 15407a26-f9e9-4132-9989-4c511c76bf08
status: experimental
description: Detects process command lines referencing both the NTDS.dit Active Directory database and the SYSTEM registry hive simultaneously, indicating preparation for offline credential extraction (T1003.003). The co-occurrence of both file paths in a single command line is a structural invariant of the technique regardless of the specific tool or launcher used.
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: Detection Engineer
date: 2026-06-21
tags:
  - attack.t1003.003
  - attack.credential_access
logsource:
  category: process_creation
  product: windows
detection:
  selection_ntds:
    CommandLine|contains: 'ntds.dit'
  selection_system_hive:
    CommandLine|contains:
      - 'config\SYSTEM'
      - 'SYSTEM_HIVE'
  filter_backup_agents:
    Image|endswith:
      - '\wbengine.exe'
      - '\ntdsutil.exe'
      - '\vssvc.exe'
      - '\dfsrs.exe'
      - '\dfsr.exe'
  condition: selection_ntds and selection_system_hive and not filter_backup_agents
falsepositives:
  - Active Directory backup agents referencing both files in their command lines
  - Legitimate ntdsutil IFM operations (filtered by Image)
  - DFSR replication internals (filtered by Image)
  - Windows Server Backup (wbengine.exe filtered by Image)
level: high