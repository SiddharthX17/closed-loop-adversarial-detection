title: NTDS.dit and SYSTEM Hive Referenced Together in Process Command Line
id: 3f0c9289-4dfa-4b9b-acb7-ff6db50077b7
status: experimental
description: >
  Detects process creation events where the command line references both the NTDS.dit
  database path and the SYSTEM registry hive path simultaneously, indicating preparation
  for offline NTDS credential extraction. The co-occurrence of both required files in a
  single command line is a high-fidelity indicator of T1003.003 activity regardless of
  the specific tool used to perform the copy.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
      - 'ntds.dit'
      - 'config\SYSTEM'
  filter_ntdsutil:
    Image|endswith: '\ntdsutil.exe'
  filter_backup_wbengine:
    Image|endswith: '\wbengine.exe'
  condition: selection and not 1 of filter_*
falsepositives:
  - Custom backup scripts that reference both NTDS.dit and the SYSTEM hive simultaneously
  - Third-party backup agents not covered by the existing filters — investigate and allowlist by Image path if confirmed legitimate
level: high