title: "NTDS.dit and SYSTEM Hive Copy for Credential Extraction"
id: 533f19f5-36ad-426c-bf9b-99930d91bbc4
status: experimental
description: "Detects a single process invocation whose command line references both the ntds.dit database and the SYSTEM registry hive, a tool-agnostic pairing required to extract Active Directory credential material offline, or diskshadow.exe executed with a scripted command file consistent with VSS-based ntds.dit extraction."
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-28
tags:
    - attack.credential-access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_ntds_ref:
      CommandLine|contains: 'ntds.dit'
    selection_system_hive_ref:
      CommandLine|contains:
        - '\config\SYSTEM'
        - 'SYSTEM_HIVE'
        - 'SYSTEM.hiv'
    selection_diskshadow:
      Image|endswith: '\diskshadow.exe'
      CommandLine|contains: '/s '
    condition: (selection_ntds_ref and selection_system_hive_ref) or selection_diskshadow
falsepositives:
    - "Domain Controller backup/disaster-recovery software (e.g. Windows Server Backup, third-party AD backup agents) legitimately copying ntds.dit and the SYSTEM hive together as part of scheduled backup jobs — verify against known backup task names/GUIDs and restrict high-severity alerting to non-DC hosts where ntds.dit should never legitimately exist"
    - "Legitimate use of diskshadow.exe scripted via /s <file> for VSS-based backup or disaster-recovery automation by IT/DR administrators — diskshadow execution alone does not confirm credential theft and should be corroborated with references to ntds.dit or SYSTEM hive paths, or investigated based on the calling script's origin and signing status"
    - "Domain controller migration or forensic imaging activities that intentionally access ntds.dit and SYSTEM hive copies for legitimate administrative purposes"
level: high