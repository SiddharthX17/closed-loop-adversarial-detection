title: "NTDS.dit Extraction via Command-Line Reference to NTDS and SYSTEM Hive Paths"
id: 5f8684a9-f09c-4415-820e-571ef9015c4c
status: experimental
description: "Detects process command lines referencing the Active Directory database file (ntds.dit) together with the SYSTEM registry hive path, a combination indicative of offline credential extraction regardless of the copy mechanism (raw/MFT copy, VSS, ntdsutil) or launching interpreter (mshta, rundll32, PowerShell). Anchors on ntds.dit alone as a sufficient standalone signal since legitimate command lines referencing this path outside of dedicated AD backup tooling are exceedingly rare, and additionally raises confidence when the SYSTEM hive config path co-occurs in the same command line."
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-28
tags:
    - attack.credential-access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_ntds:
      CommandLine|contains: 'ntds.dit'
    selection_system_hive:
      CommandLine|contains|windash: 'config\SYSTEM'
    filter_signed_backup_tool:
      Image|endswith:
        - '\System32\ntdsutil.exe'
        - '\System32\wbadmin.exe'
        - '\System32\vssadmin.exe'
    condition: selection_ntds and not filter_signed_backup_tool
falsepositives:
    - "Legitimate Active Directory backup, restore, or disaster-recovery operations using ntdsutil.exe, wbadmin.exe, or vssadmin.exe from their default System32 path (filtered by Image identity, not parent process)"
    - "Administrative or forensic scripts, documentation, or training materials that mention ntds.dit in a command line without performing actual extraction (rare)"
    - "Third-party AD auditing or forensic tools that legitimately reference ntds.dit for inventory or health-check purposes — not filtered here since Image identity for such tools is not established as trustworthy by default"
level: critical