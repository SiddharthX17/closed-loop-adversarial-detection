title: "NTDS.dit Raw Copy via Command-Line Reference"
id: a0c34f6e-4fe7-4f74-a8e0-47dddf07a303
status: experimental
description: "Detects command-line references to the NTDS.dit Active Directory database file, optionally paired with the SYSTEM registry hive path, indicating an attempt to extract domain credential material outside the normal ntdsutil/backup workflow (e.g. raw MFT-level copy or scripted exfiltration)."
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_ntds:
        CommandLine|contains: 'ntds.dit'
    selection_system_hive:
        CommandLine|contains:
            - '\config\SYSTEM'
            - 'SYSTEM_HIVE'
    filter_legit_backup_tool:
        Image|endswith:
            - '\ntdsutil.exe'
            - '\wbadmin.exe'
    condition: (selection_ntds or selection_system_hive) and not filter_legit_backup_tool
falsepositives:
    - "Legitimate Active Directory backup/disaster-recovery operations invoking ntdsutil.exe or wbadmin.exe directly (filtered by Image path)"
    - "Endpoint security or backup agents that scan, index, or back up the NTDS folder using their own signed binaries — these should be exempted individually by verified Image path/hash if observed, not by folder location, since this rule does not currently exclude them"
    - "AD health-check or migration scripts authored by internal IT that legitimately reference ntds.dit or the SYSTEM hive path outside ntdsutil — rare, but possible in some environments and worth investigating rather than blanket-exempting"
level: critical