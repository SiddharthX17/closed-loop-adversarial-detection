title: "LSA Secrets Registry Hive Dump via Reg Save"
id: 36117427-aafe-4292-ba43-6b0b67e0592e
status: experimental
description: "Detects a process command line invoking 'reg save' against the HKLM\\SECURITY\\Policy\\Secrets registry key, which is the only registry-accessible source of LSA secrets (service account credentials, cached DPAPI keys) and is not exercised by routine administration or backup workflows."
references:
    - https://attack.mitre.org/techniques/T1003/004/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-26
tags:
    - attack.credential-access
    - attack.t1003.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
      CommandLine|contains: 'save'
      CommandLine|re: '(?i)reg(\.exe)?\s'
      CommandLine|contains|all:
        - 'security'
        - 'policy'
        - 'secrets'
    condition: selection
falsepositives:
    - "Legitimate registry backup/export scripts that use 'reg save' against unrelated hives (e.g. SAM, SYSTEM) — these will not match since the rule requires the literal security\\policy\\secrets path"
    - "Security tooling or EDR agents performing forensic hive backups of the SECURITY hive for health-check purposes — should be exempted only by verifying the invoking process's own Image path and code-signing identity against a known agent binary, not by parent process or directory"
    - "Use of PsExec or similar remote-execution utilities for unrelated administrative tasks — not filtered here since PsExec presence is not required by this rule, only the reg save command against the secrets path triggers it"
level: critical