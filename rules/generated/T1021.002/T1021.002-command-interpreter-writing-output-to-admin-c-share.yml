title: "T1021.002 - Command Interpreter Writing Output to ADMIN$/C$ Share"
id: 71d4f063-63ac-4a68-9fe8-1390e5d6f257
status: experimental
description: "Detects a command interpreter (cmd.exe, powershell.exe, or similar LOLBin) executing a command whose output is redirected or copied to a hidden administrative SMB share (ADMIN$ or C$), a pattern consistent with remote command execution via PsExec-style SMB lateral movement rather than legitimate local administration."
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-27
tags:
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_interpreter:
      Image|endswith:
        - '\cmd.exe'
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
        - '\wmic.exe'
        - '\wscript.exe'
        - '\cscript.exe'
    selection_share:
      CommandLine|contains:
        - '\ADMIN$\'
        - '\ADMIN$\'
        - '\C$\'
        - '\C$\'
    selection_write_op:
      CommandLine|contains:
        - '1>'
        - '>>'
        - 'Out-File'
        - 'copy '
        - 'xcopy '
        - 'Copy-Item'
        - 'move '
    condition: selection_interpreter and selection_share and selection_write_op
falsepositives:
    - "Legitimate remote administration or scripting tools that write logs, configuration, or deployment artifacts to ADMIN$/C$ shares (e.g., some backup, inventory, or software distribution agents) — should be validated against a signed, known-good Image path/hash rather than exempted by directory or parent process."
    - "Manual IT helpdesk troubleshooting where an administrator intentionally redirects diagnostic command output to a remote admin share during legitimate remote support."
    - "Custom enterprise deployment scripts that rely on copying files through administrative shares as part of approved software rollout processes."
level: high