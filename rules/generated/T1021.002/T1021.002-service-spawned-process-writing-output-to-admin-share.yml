title: "T1021.002 - Service-Spawned Process Writing Output to Admin Share"
id: 241ac331-aa8d-40de-9945-e9164c7a23e2
status: experimental
description: "Detects a process spawned by services.exe or a generic svchost.exe service host whose command line references a UNC path to an administrative share (ADMIN$, C$, IPC$), consistent with remote command execution via SMB admin shares and staging/exfiltration of output through the share."
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
      ParentImage|endswith:
        - '\services.exe'
        - '\svchost.exe'
    selection_uncshare:
      CommandLine|contains:
        - '\ADMIN$\'
        - '\C$\'
        - '\IPC$\'
    condition: selection_parent and selection_uncshare
falsepositives:
    - "Legitimate enterprise remote administration or deployment tooling (e.g., SCCM, PDQ Deploy, backup agents) that installs itself as a Windows service and writes logs or output to administrative shares — should be filtered by allowlisting the specific verified deployment agent binary path/hash of the spawned process, not by ParentImage or CurrentDirectory."
    - "Help-desk manual diagnostics or scripted log collection (e.g., ipconfig/systeminfo piped to a central ADMIN$ share) run through a temporary service — isolated occurrences may be legitimate; a high volume of distinct destination hosts from a single source in a short window is a stronger indicator of automation/lateral movement."
    - "Software distribution or patch management systems that spawn service-hosted processes and stage files via UNC admin-share paths as part of normal operation."
level: high