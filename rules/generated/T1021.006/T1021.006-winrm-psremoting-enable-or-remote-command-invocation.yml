title: "WinRM PSRemoting Enable or Remote Command Invocation"
id: c31bab8c-ab36-40e4-841e-7c363f90b7d7
status: experimental
description: "Detects command lines invoking PowerShell cmdlets that enable WinRM/PSRemoting or execute commands against remote hosts (Enable-PSRemoting, Invoke-Command -ComputerName, New-PSSession, Enter-PSSession), indicating potential lateral movement setup or use via Windows Remote Management regardless of the delivery mechanism."
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-27
tags:
    - attack.lateral-movement
    - attack.t1021.006
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_enable:
      CommandLine|contains:
        - 'Enable-PSRemoting'
        - 'winrm quickconfig'
    selection_invoke:
      CommandLine|contains:
        - 'Invoke-Command'
        - 'New-PSSession'
        - 'Enter-PSSession'
    selection_remote_scope:
      CommandLine|contains:
        - '-ComputerName'
        - '-Cn '
    condition: selection_enable or (selection_invoke and selection_remote_scope) or selection_invoke
falsepositives:
    - "Legitimate remote administration via PowerShell remoting (help-desk troubleshooting, sysadmin scripts using Invoke-Command or New-PSSession/Enter-PSSession)"
    - "Configuration management tooling (DSC, Ansible via WinRM, SCCM) invoking Enable-PSRemoting or Invoke-Command as part of routine automation"
    - "Scheduled scripts or deployment pipelines that enable WinRM remoting or invoke commands against a fleet of remote hosts"
    - "Security tooling or vulnerability scanners that use PSRemoting cmdlets to assess remote hosts"
level: medium