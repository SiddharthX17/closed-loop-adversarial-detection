title: Legitimate Process Name Masquerading Via OriginalFileName Mismatch
id: b77acc14-d498-4650-868d-37aef25b34dc
status: experimental
description: |
  Detects process execution where the OriginalFileName field indicates a different legitimate Windows binary than the actual Image being executed.
  This technique allows attackers to masquerade malicious or renamed binaries as legitimate system processes by manipulating the OriginalFileName metadata.
  The rule specifically targets cases where a process is executed from a legitimate location but with a mismatched OriginalFileName pointing to a different system binary.
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://mgreen27.github.io/posts/2019/05/12/BinaryRename.html
author: Detection Engineer
date: 2026-05-06
modified: 2026-05-06
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\lsass.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\csrss.exe'
      - '\services.exe'
      - '\winlogon.exe'
    OriginalFileName:
      - 'svchost.exe'
      - 'services.exe'
      - 'lsass.exe'
      - 'csrss.exe'
      - 'winlogon.exe'
  filter_matching_names:
    Image|endswith: '\svchost.exe'
    OriginalFileName: 'svchost.exe'
  filter_matching_lsass:
    Image|endswith: '\lsass.exe'
    OriginalFileName: 'lsass.exe'
  filter_matching_cmd:
    Image|endswith: '\cmd.exe'
    OriginalFileName: 'Cmd.Exe'
  filter_matching_csrss:
    Image|endswith: '\csrss.exe'
    OriginalFileName: 'csrss.exe'
  filter_matching_services:
    Image|endswith: '\services.exe'
    OriginalFileName: 'services.exe'
  filter_matching_winlogon:
    Image|endswith: '\winlogon.exe'
    OriginalFileName: 'winlogon.exe'
  condition: selection and not 1 of filter_matching_*
falsepositives:
  - Rare legitimate software that intentionally uses mismatched OriginalFileName values
level: high