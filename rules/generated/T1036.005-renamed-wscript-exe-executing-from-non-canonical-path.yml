title: Renamed WScript.exe Executing from Non-Canonical Path
id: fe52fb60-d778-4c5b-b602-efbb645233f8
status: experimental
description: |
  Detects execution of a binary whose OriginalFileName is wscript.exe but whose Image path
  is not the canonical C:\Windows\System32\wscript.exe or C:\Windows\SysWOW64\wscript.exe.
  Attackers rename wscript.exe to a trusted process name and place it in a user-writable
  location to execute VBScript payloads while evading process-name-based detection controls.
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://mgreen27.github.io/posts/2019/05/12/BinaryRename.html
author: Detection Engineer
date: 2026-06-16
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'wscript.exe'
  filter_canonical_paths:
    Image:
      - 'C:\Windows\System32\wscript.exe'
      - 'C:\Windows\SysWOW64\wscript.exe'
  filter_security_vendors:
    Image|contains:
      - '\Program Files\Symantec\'
      - '\Program Files\Sophos\'
      - '\Program Files\CrowdStrike\'
      - '\Program Files\Carbon Black\'
      - '\Program Files\Cylance\'
      - '\Program Files\SentinelOne\'
      - '\Program Files\Malwarebytes\'
      - '\Program Files\ESET\'
      - '\Program Files\Trend Micro\'
      - '\Program Files\McAfee\'
      - '\Program Files\Kaspersky\'
      - '\Program Files\Bitdefender\'
      - '\Program Files\Webroot\'
      - '\Program Files\F-Secure\'
  condition: selection and not 1 of filter_*
falsepositives:
  - Security or EDR products that copy or shadow system binaries for analysis purposes
  - Legitimate software that bundles a renamed copy of wscript.exe (extremely rare)
level: high