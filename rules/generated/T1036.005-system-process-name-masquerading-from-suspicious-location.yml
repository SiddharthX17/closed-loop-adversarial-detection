title: System Process Name Masquerading From Suspicious Location
id: 9330fd1e-2d98-49a1-ba59-9467c06085f4
status: experimental
description: |
  Detects execution of binaries named after legitimate Windows system processes (lsass.exe, winlogon.exe, csrss.exe, etc.)
  from non-standard locations such as user temp directories, public folders, or AppData paths.
  Adversaries compile or copy malicious executables with system process names to evade detection.
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://mgreen27.github.io/posts/2019/05/12/BinaryRename.html
author: Detection Engineer
date: 2026-06-18
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_system_process_names:
    Image|endswith:
      - '\lsass.exe'
      - '\winlogon.exe'
      - '\csrss.exe'
      - '\services.exe'
      - '\smss.exe'
      - '\wininit.exe'
      - '\spoolsv.exe'
      - '\lsm.exe'
  filter_legitimate_locations:
    Image|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Windows\WinSxS\'
  selection_suspicious_locations:
    Image|contains:
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Temp\'
      - '\ProgramData\'
      - '\Downloads\'
  condition: selection_system_process_names and not filter_legitimate_locations
falsepositives:
  - Unlikely in production environments; possible in development or testing scenarios
level: high