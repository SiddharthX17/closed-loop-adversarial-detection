title: Windows System Process Masquerading From Non-System Directory
id: 5b3c93c4-af29-4bc4-a955-a76caaaae1c7
status: experimental
description: |
  Detects execution of binaries whose filenames match known Windows system process names
  but whose full image path is outside legitimate Windows system directories.
  Adversaries name malicious binaries after system processes (lsass.exe, svchost.exe, etc.)
  and place them in user-writable directories to evade process-name-based detection controls.
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://redcanary.com/blog/threat-detection/process-masquerading/
author: Detection Engineer
date: 2026-06-17
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\lsass.exe'
      - '\spoolsv.exe'
      - '\svchost.exe'
      - '\csrss.exe'
      - '\smss.exe'
      - '\winlogon.exe'
      - '\wininit.exe'
      - '\services.exe'
      - '\lsm.exe'
      - '\taskhost.exe'
      - '\taskhostw.exe'
  filter_system32:
    Image|startswith: 'C:\Windows\System32\'
  filter_syswow64:
    Image|startswith: 'C:\Windows\SysWOW64\'
  filter_winsxs:
    Image|startswith: 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_*
falsepositives:
  - Portable or self-contained application bundles that ship executables with common names
    into user profile directories (extremely rare for the named high-value system process names)
  - Virtualisation or sandbox environments that redirect system paths
level: high