title: System Process Name Masquerading From User-Writable Directory
id: 7983fb82-b62d-4bf8-a004-6aba8686e0f9
status: experimental
description: |
  Detects execution of binaries whose filenames match known Windows system process names
  but whose full image path is outside canonical system directories (System32, SysWOW64, Windows\).
  Adversaries name malicious executables after legitimate system processes and place them in
  user-writable directories to evade process-based detection (T1036.005).
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://redcanary.com/blog/threat-detection/process-masquerading/
author: Detection Engineer
date: 2026-06-10
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_system_process_names:
    Image|endswith:
      - '\lsass.exe'
      - '\winlogon.exe'
      - '\svchost.exe'
      - '\csrss.exe'
      - '\services.exe'
      - '\smss.exe'
      - '\wininit.exe'
      - '\lsm.exe'
      - '\taskhost.exe'
      - '\taskhostw.exe'
      - '\spoolsv.exe'
      - '\explorer.exe'
      - '\userinit.exe'
      - '\dwm.exe'
  filter_system_paths:
    Image|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Windows\WinSxS\'
      - '\Windows\explorer.exe'
      - '\Windows\SysNative\'
  filter_security_tools:
    ParentImage|contains:
      - '\CrowdStrike\'
      - '\Symantec\'
      - '\CarbonBlack\'
      - '\SentinelOne\'
      - '\Cylance\'
      - '\MsMpEng.exe'
      - '\MRT.exe'
  condition: selection_system_process_names and not 1 of filter_*
falsepositives:
  - Security tooling or AV sandboxes that copy system binaries for analysis
  - Forensic or incident response tools extracting system binaries to alternate paths
level: high