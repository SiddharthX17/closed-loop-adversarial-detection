title: "T1053.005 - Base64 Encoded Command Staged in HKCU Registry Value"
id: 75a13101-f307-4828-bb09-32131098565d
status: experimental
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-07-17
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    category: registry_set
    product: windows
detection:
    selection_hive:
      TargetObject|contains: '\SOFTWARE\'
    selection_details_b64:
      Details|re: '^[A-Za-z0-9+/]{16,}={0,2}$'
    filter_structured:
      Details|contains:
        - '{'
        - '<'
        - '"license'
        - '"config'
    condition: selection_hive and selection_details_b64 and not filter_structured
falsepositives:
    - "Legitimate software storing base64-encoded configuration, license keys, or structured data (JSON/XML) under HKCU\\SOFTWARE — mitigated by excluding Details values that decode/appear as structured config rather than command syntax, but the filter is heuristic and may not catch every non-malicious base64 blob"
    - "Software update or telemetry components that cache encoded tokens or session identifiers in per-user registry keys"
    - "Browser extensions or Electron-based apps storing encoded state blobs in HKCU\\SOFTWARE subkeys"
    - "Detection does not confirm a scheduled task was actually created — this only flags registry staging behavior; a companion process_creation rule for schtasks.exe /create or PowerShell ScheduledTasks cmdlets referencing script interpreters or -enc flags is needed to close the coverage gap on the actual task-registration event"
level: medium