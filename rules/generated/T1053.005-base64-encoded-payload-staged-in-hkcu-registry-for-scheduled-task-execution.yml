title: Base64 Encoded Payload Staged in HKCU Registry for Scheduled Task Execution
id: e66d7887-58d4-4941-955e-0f9501b53347
status: experimental
description: |
    Detects base64-encoded or obfuscated content written to HKEY_CURRENT_USER\SOFTWARE registry paths
    outside standard Windows locations. This pattern is consistent with attackers staging encoded payloads
    in user-writable registry hives to decouple payload delivery from scheduled task execution, evading
    command-line based detection of T1053.005.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: Detection Engineering
date: 2024-06-07
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: registry_set
    product: windows
detection:
    selection_hive:
        TargetObject|contains: '\SOFTWARE\'
        TargetObject|contains|all:
            - 'HKEY_CURRENT_USER'
    selection_encoded:
        Details|re: '^[A-Za-z0-9+/]{16,}={0,2}$'
    filter_known_legit_paths:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\'
            - '\SOFTWARE\Classes\'
            - '\SOFTWARE\Policies\'
            - '\SOFTWARE\Google\'
            - '\SOFTWARE\Mozilla\'
            - '\SOFTWARE\Adobe\'
            - '\SOFTWARE\Wow6432Node\Microsoft\'
    condition: all of selection_* and not 1 of filter_*
falsepositives:
    - Legitimate applications storing base64-encoded configuration data in HKCU\SOFTWARE
    - Software deployment tools staging encoded parameters in registry
    - Development and testing tools writing encoded data for legitimate purposes
    - Third-party automation frameworks storing encoded metadata
level: medium