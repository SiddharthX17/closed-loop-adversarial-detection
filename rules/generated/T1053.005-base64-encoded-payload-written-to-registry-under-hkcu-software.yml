title: Base64-Encoded Payload Written to Registry Under HKCU Software
id: cfdc1116-6584-471e-a0ff-c6b9db445068
status: experimental
description: |
    Detects Sysmon registry value set events (EID 13) where a base64-encoded string is written
    to a registry key under HKCU\SOFTWARE. This pattern is consistent with attacker staging of
    encoded command payloads for scheduled task persistence (T1053.005) or other persistence
    mechanisms. Legitimate software occasionally writes base64-encoded configuration to this
    location; filters exclude well-known vendor subkeys to reduce false positives.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: Detection Engineer
date: 2024-06-10
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    category: registry_set
    product: windows
detection:
    selection_hive:
        TargetObject|contains: '\SOFTWARE\'
        TargetObject|contains|windash:
            - 'HKEY_CURRENT_USER\'
            - 'HKCU\'
    selection_base64:
        Details|re: '^[A-Za-z0-9+/]{16,}={0,2}$'
    filter_vendor_microsoft:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\'
    filter_vendor_google:
        TargetObject|contains:
            - '\SOFTWARE\Google\'
    filter_vendor_mozilla:
        TargetObject|contains:
            - '\SOFTWARE\Mozilla\'
    filter_vendor_adobe:
        TargetObject|contains:
            - '\SOFTWARE\Adobe\'
    filter_vendor_intel:
        TargetObject|contains:
            - '\SOFTWARE\Intel\'
    filter_vendor_oracle:
        TargetObject|contains:
            - '\SOFTWARE\Oracle\'
    condition: all of selection_* and not 1 of filter_vendor_*
falsepositives:
    - Legitimate software writing base64-encoded configuration blobs to HKCU\SOFTWARE (installers, DRM, enterprise agents)
    - Security tooling and EDR agents writing encoded telemetry or configuration data
    - Application licensing or activation mechanisms storing encoded tokens
level: medium