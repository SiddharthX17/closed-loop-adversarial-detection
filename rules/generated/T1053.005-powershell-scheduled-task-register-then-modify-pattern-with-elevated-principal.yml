title: PowerShell Scheduled Task Register-Then-Modify Pattern with Elevated Principal
id: ff2e2fd1-3f99-4bb7-b3bf-4601fe6cd3fc
status: experimental
description: |
    Detects PowerShell command lines that contain both Register-ScheduledTask and Set-ScheduledTask
    in a single invocation, combined with a privileged principal configuration targeting
    BUILTIN\Administrators at RunLevel Highest. This register-then-modify pattern is used to
    create a scheduled task with a benign action and immediately overwrite it with a malicious
    payload, evading some task creation monitoring. The combination of both cmdlets in a single
    command line is highly anomalous and has very low legitimate use.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://docs.microsoft.com/en-us/powershell/module/scheduledtasks/register-scheduledtask
    - https://docs.microsoft.com/en-us/powershell/module/scheduledtasks/set-scheduledtask
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell:
        CommandLine|contains:
            - 'powershell'
    selection_register_modify:
        CommandLine|contains|all:
            - 'Register-ScheduledTask'
            - 'Set-ScheduledTask'
    selection_privileged_principal:
        CommandLine|contains|all:
            - 'New-ScheduledTaskPrincipal'
            - 'RunLevel Highest'
            - 'Administrators'
    filter_management_tools:
        ParentImage|contains:
            - '\Microsoft Intune\'
            - '\CCM\'
            - '\Microsoft Endpoint Manager\'
            - '\EndpointProtection\'
    condition: all of selection_* and not filter_management_tools
falsepositives:
    - Enterprise software deployment and endpoint management automation that registers and reconfigures scheduled tasks in a single PowerShell invocation
    - IT administrator scripts that programmatically create and immediately modify scheduled tasks with elevated principals
    - Security tooling and EDR agents creating elevated scheduled tasks via PowerShell cmdlets
level: high