title: PowerShell Scheduled Task Registration with Elevated Administrators Principal
id: 6c7fdc8a-2c7b-49ea-8836-3f426cbca870
status: experimental
description: |
    Detects PowerShell-based scheduled task registration or modification using native cmdlets
    (Register-ScheduledTask or Set-ScheduledTask) combined with RunLevel Highest and an
    Administrators group principal. This combination is a high-fidelity indicator of an attacker
    attempting to establish privileged persistence via programmatic task creation.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/en-us/powershell/module/scheduledtasks/register-scheduledtask
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmdlet:
        CommandLine|contains:
            - 'Register-ScheduledTask'
            - 'Set-ScheduledTask'
    selection_runlevel:
        CommandLine|contains: '-RunLevel Highest'
    selection_principal:
        CommandLine|contains: 'Administrators'
    filter_known_installers:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\TrustedInstaller.exe'
    condition: all of selection_* and not 1 of filter_*
falsepositives:
    - IT automation and configuration management scripts (Ansible, SCCM, Puppet) that legitimately
      register elevated scheduled tasks via PowerShell cmdlets
    - Software installers that programmatically create elevated scheduled tasks at install time
    - Legitimate administrative PowerShell scripts run by privileged users in managed environments
level: high