title: Registry Write with Encoded Payload for Scheduled Task Staging
id: 1ed71a2a-79ac-482a-baef-7ef4cb647b81
status: experimental
description: |
    Detects registry writes to HKEY_CURRENT_USER\SOFTWARE paths where the Details field
    contains base64-encoded or hex-encoded content, consistent with attackers staging
    encoded command payloads in the registry for deferred execution via scheduled tasks.
    This technique stores obfuscated payloads in user-writable registry hives to evade
    static detection, with subsequent task creation tools reading and executing the content.
references:
    - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
    - https://attack.mitre.org/techniques/T1053/005/
author: Detection Engineering
date: 2024-01-01
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    category: registry_set
    product: windows
detection:
    selection_path:
        TargetObject|contains: '\SOFTWARE\'
        TargetObject|contains|all:
            - 'HKEY_CURRENT_USER'
    selection_encoded_base64:
        Details|re: '^[A-Za-z0-9+/]{16,}={0,2}$'
    selection_encoded_hex:
        Details|re: '^[0-9A-Fa-f]{32,}$'
    filter_known_software:
        Image|endswith:
            - '\msiexec.exe'
            - '\svchost.exe'
            - '\TrustedInstaller.exe'
            - '\WmiPrvSE.exe'
            - '\MsMpEng.exe'
            - '\ccmexec.exe'
            - '\csc.exe'
    filter_system_paths:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Program Files\WindowsApps\'
    condition: selection_path and (selection_encoded_base64 or selection_encoded_hex) and not filter_known_software
falsepositives:
    - Software deployment and configuration management systems writing encoded task parameters
    - Application installers registering scheduled tasks with encoded parameters
    - Enterprise monitoring and RMM platforms storing encoded configuration data
    - System backup and recovery utilities storing encoded task metadata
level: medium