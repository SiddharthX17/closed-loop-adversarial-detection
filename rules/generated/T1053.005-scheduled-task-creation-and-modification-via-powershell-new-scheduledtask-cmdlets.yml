title: Scheduled Task Creation and Modification via PowerShell New-ScheduledTask Cmdlets
id: 60c04e77-f1ae-4795-8f15-809f59b7409e
status: experimental
description: Detects PowerShell usage of New-ScheduledTask and Register-ScheduledTask cmdlets combined with Set-ScheduledTask to create and then modify a scheduled task, a pattern commonly used by attackers to establish persistence with elevated privileges.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: Detection Engineer
date: 2026-06-14
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell:
        CommandLine|contains:
            - 'powershell'
    selection_register:
        CommandLine|contains: 'Register-ScheduledTask'
    selection_set:
        CommandLine|contains: 'Set-ScheduledTask'
    selection_principal:
        CommandLine|contains:
            - 'New-ScheduledTaskPrincipal'
    selection_runlevel:
        CommandLine|contains:
            - 'RunLevel Highest'
            - 'Highest'
    condition: all of selection_*
falsepositives:
    - Legitimate administrative scripts that create and modify scheduled tasks with elevated privileges
level: high