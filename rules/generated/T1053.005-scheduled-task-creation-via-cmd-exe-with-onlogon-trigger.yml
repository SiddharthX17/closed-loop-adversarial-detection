title: Scheduled Task Creation via cmd.exe with Onlogon Trigger
id: 154f8d3e-b864-4bf3-9459-1bbecdc1ada6
status: experimental
description: |
    Detects scheduled task creation via cmd.exe executing schtasks with onlogon trigger.
    This pattern indicates potential persistence mechanisms where cmd.exe is used as an intermediary to create scheduled tasks with logon-based execution.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Detection Engineer
date: 2026-05-06
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
        OriginalFileName: 'cmd.exe'
    selection_schtasks_create:
        CommandLine|contains|all:
            - 'schtasks'
            - '/create'
    selection_suspicious_trigger:
        CommandLine|contains:
            - '/sc onlogon'
            - '/sc ONLOGON'
    selection_task_action:
        CommandLine|contains:
            - '/tr'
    condition: all of selection_*
falsepositives:
    - Unlikely; combination of cmd.exe executing schtasks with onlogon trigger is suspicious
level: high