title: Scheduled Task Creation via Schtasks or PowerShell Register-ScheduledTask
id: e145037a-2e93-4971-a9f9-88e166a58d5c
status: experimental
description: |
    Detects scheduled task creation using schtasks.exe with /create flag or PowerShell Register-ScheduledTask cmdlet.
    This rule identifies direct task creation attempts that may bypass existing detections by using basic command structures
    without obfuscation or suspicious payloads, focusing on the core creation mechanism itself.
references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
    - https://learn.microsoft.com/en-us/powershell/module/scheduledtasks/register-scheduledtask
author: Detection Engineer
date: 2025-01-01
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_schtasks_create:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|windash:
            - ' /create '
            - ' /Create '
    selection_schtasks_create_params:
        CommandLine|contains|windash:
            - ' /tn '
            - ' /tr '
            - ' /sc '
    selection_powershell_register:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Register-ScheduledTask'
    condition: (selection_schtasks_create and  selection_schtasks_create_params) or selection_powershell_register
falsepositives:
    - Legitimate system administration and software deployment tasks
    - Enterprise task scheduling for backups and maintenance
level: medium
