title: UAC Bypass via mscfile COM Handler Registry Hijack
id: 11b744c0-0dd8-4678-a5a8-b0d9a7ab9516
status: experimental
description: |
    Detects any write to the HKCU\Software\Classes\mscfile\shell\open\command registry key,
    which is used to hijack the mscfile COM object lookup for silent UAC bypass. Writing an
    arbitrary executable to this path allows attackers to execute payloads at elevated integrity
    without user prompting. This path has no legitimate write use case in enterprise environments.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://enigma0x3.net/2016/08/15/fileless-uac-bypass-using-eventvwr-exe-and-registry-hijacking/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1548.002/T1548.002.md
author: Detection Engineer
date: 2024-01-01
tags:
    - attack.execution
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1053.005
    - attack.t1548.002
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\Software\Classes\mscfile\shell\open\command'
    condition: selection
falsepositives:
    - Security testing and red team exercises — triage required; exclude known red team hosts via host allowlist if operationally required
    - No known legitimate software writes to this COM hijack path in enterprise environments
level: high