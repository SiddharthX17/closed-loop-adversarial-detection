title: PowerShell Scheduled Task Registration with Elevated Principal and Logon Trigger
id: bd5f77f5-9b6e-4e75-abd7-3ce69e7e2000
status: experimental
description: |
  Detects PowerShell command lines that register or modify scheduled tasks using the ScheduledTasks module
  with an elevated principal (-RunLevel Highest) and a logon-based trigger (-AtLogon). This combination
  is structurally required for attacker-controlled persistence via PowerShell task registration and is
  rarely present in legitimate administrative automation invoked interactively. Covers both direct
  PowerShell invocation and LOLBin-spawned PowerShell (e.g., mshta.exe launching powershell.exe).
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/powershell/module/scheduledtasks/register-scheduledtask
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_task_registration:
    CommandLine|contains:
      - 'Register-ScheduledTask'
      - 'New-ScheduledTask'
  selection_elevated_principal:
    CommandLine|contains: '-RunLevel Highest'
  selection_logon_trigger:
    CommandLine|contains:
      - '-AtLogon'
      - '-AtStartup'
  selection_bypass:
    CommandLine|contains:
      - '-ExecutionPolicy Bypass'
      - '-ExecutionPolicy bypass'
      - '-ep bypass'
      - '-ep Bypass'
  filter_known_deployment_paths:
    Image|contains:
      - '\Program Files\'
      - '\Program Files (x86)\'
      - '\ProgramData\chocolatey\'
      - '\Windows\CCM\'
  condition: all of selection_task_registration and selection_elevated_principal and selection_logon_trigger and selection_bypass and not filter_known_deployment_paths
falsepositives:
  - Legitimate IT automation scripts using PowerShell ScheduledTasks module with elevated principals invoked from known software deployment directories
  - MDM or SCCM agents registering scheduled tasks with elevated privileges at logon
  - Administrative PowerShell sessions run by IT staff for scripted deployments from sanctioned management tools
level: high