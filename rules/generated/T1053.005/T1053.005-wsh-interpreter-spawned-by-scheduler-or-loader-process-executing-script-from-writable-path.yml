title: WSH Interpreter Spawned by Scheduler or Loader Process Executing Script from Writable Path
id: 09a91ef1-5e25-4f77-ad55-38a652652c00
status: experimental
description: |
  Detects Windows Script Host interpreters (cscript.exe or wscript.exe) executing script files
  located in user-writable or world-accessible directories when spawned by scheduler-associated
  or loader parent processes. This pattern is consistent with T1053.005 where attackers configure
  scheduled tasks to execute attacker-controlled scripts under SYSTEM context.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://thedfirreport.com/
author: Detection Engineer
date: 2024-01-01
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\cscript.exe'
      - '\wscript.exe'
  selection_parent:
    ParentImage|endswith:
      - '\svchost.exe'
      - '\taskeng.exe'
      - '\taskhostw.exe'
      - '\rundll32.exe'
      - '\mshta.exe'
  selection_writable_path:
    CommandLine|contains:
      - '\Users\Public\'
      - '\ProgramData\'
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '%AppData%'
      - '%Temp%'
      - '%tmp%'
  filter_management_paths:
    CommandLine|contains:
      - '\ProgramData\Microsoft\Windows\'
      - '\ProgramData\Microsoft\Windows Defender\'
      - '\ProgramData\Microsoft\Windows NT\'
      - '\ProgramData\SCCM\'
      - '\ProgramData\ConfigMgr\'
      - '\ProgramData\ManagementAgent\'
      - '\ProgramData\Intune\'
  condition: all of selection_* and not filter_management_paths
falsepositives:
  - Enterprise management tooling (SCCM, Intune, GPO scripts) invoking WSH interpreters from ProgramData subdirectories
  - Legitimate user-scheduled maintenance scripts running from user-writable paths
  - Software installers and update mechanisms using rundll32 as a launcher for WSH scripts
level: high