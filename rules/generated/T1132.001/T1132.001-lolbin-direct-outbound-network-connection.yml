title: "LOLBin Direct Outbound Network Connection"
id: bce1fad8-9975-4136-8c79-553f0dfb585c
status: experimental
references:
    - https://attack.mitre.org/techniques/T1132/001/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-21
tags:
    - attack.command-and-control
    - attack.t1132.001
logsource:
    category: network_connection
    product: windows
detection:
    selection:
      Initiated: 'true'
      Image|endswith:
        - '\mshta.exe'
        - '\rundll32.exe'
        - '\certutil.exe'
        - '\regsvr32.exe'
        - '\cscript.exe'
        - '\wscript.exe'
        - '\installutil.exe'
        - '\msbuild.exe'
    condition: selection
falsepositives:
    - "Legitimate line-of-business or licensing software invoking rundll32/regsvr32/certutil for update or telemetry checks over the network — should be triaged by validating destination rarity/reputation against a known-good allowlist per binary rather than exempting by port or hostname."
    - "certutil.exe used deliberately by IT staff to retrieve certificates or CRLs from internal or vendor infrastructure."
    - "mshta.exe or wscript.exe used in some environments to run internally-approved HTA/VBS management scripts that legitimately reach internal or vendor web services."
    - "Explorer-initiated user launches of the above LOLBins are extremely common and were intentionally not used as a filtering or anchoring criterion; ancestry alone does not reduce or confirm risk here."
level: medium