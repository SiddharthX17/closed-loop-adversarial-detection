title: "T1197-BITS Job Lifecycle Verbs via Command Line"
id: 34f0481c-d3ef-4b1c-ad9d-fc6f46385a19
status: experimental
references:
    - https://attack.mitre.org/techniques/T1197/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-07-17
tags:
    - attack.defense-evasion
    - attack.t1197
logsource:
    category: process_creation
    product: windows
detection:
    selection_create:
      CommandLine|contains: '/create'
    selection_addfile:
      CommandLine|contains: '/addfile'
    selection_resume_complete:
      CommandLine|contains:
        - '/resume'
        - '/complete'
    filter_legit_bitsadmin:
      Image: 'C:\Windows\System32\bitsadmin.exe'
      CommandLine|contains: 'internal.corp.local/updates/'
    condition: selection_create and selection_addfile and selection_resume_complete and not filter_legit_bitsadmin
falsepositives:
    - "Legitimate patch/update distribution via bitsadmin.exe from the unmodified System32 path targeting an approved internal update repository (narrowly exempted here by binary path plus internal.corp.local/updates/ destination; do not extend this exemption to job names alone)"
    - "Admin or help-desk scripted use of bitsadmin.exe or PowerShell BitsTransfer cmdlets for legitimate ad-hoc file transfers from an interactive user session — not filtered here since this is indistinguishable at the command-line level from the observed attack pattern without additional corroboration (unusual path or destination)"
    - "Software deployment/patch management agents (e.g., WSUS, SCCM) invoking BITS verbs internally toward internal management server hostnames — not blanket-exempted since ParentImage and internal hostnames are attacker-spoofable; only the specific System32 bitsadmin.exe plus internal.corp.local/updates path is exempted above"
    - "PowerShell Start-BitsTransfer/Complete-BitsTransfer equivalents are not covered by this CommandLine pattern and would require separate matching logic if observed in the environment"
level: high