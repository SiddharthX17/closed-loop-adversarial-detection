title: "Script Interpreter Execution via cscript/wscript/mshta"
id: f8c4a3b3-bbde-4c5d-aada-c9e78ac97705
status: experimental
description: "Detects native Windows script interpreters (cscript.exe, wscript.exe, mshta.exe) invoking script files or inline scripting protocol handlers, a common mechanism for executing attacker-supplied code after a user opens a malicious file."
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-28
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_interpreter:
      - Image|endswith:
          - '\cscript.exe'
          - '\wscript.exe'
          - '\mshta.exe'
      - OriginalFileName:
          - 'cscript.exe'
          - 'wscript.exe'
          - 'mshta.exe'
    selection_script_ref:
      CommandLine|contains:
        - '.vbs'
        - '.js'
        - '.hta'
        - 'vbscript:'
        - 'javascript:'
    filter_netlogon:
      CommandLine|contains: '\domain\netlogon\scripts\'
    filter_hta_trusted:
      Image|endswith: '\mshta.exe'
      CommandLine|contains: '.hta'
      CommandLine|contains:
        - 'C:\Program Files\'
        - 'C:\Windows\'
    condition: selection_interpreter and selection_script_ref and not filter_netlogon and not filter_hta_trusted
falsepositives:
    - "Legitimate administrative or logon VBS/JS scripts launched via cscript/wscript from documented netlogon or admin script shares"
    - "Legitimate internal HTA applications launched via mshta.exe referencing standard .hta files from trusted installation paths (note: this exemption only reduces noise for direct .hta file references, not inline vbscript:/javascript: protocol usage, which has no common legitimate enterprise use)"
    - "Line-of-business automation tooling that relies on script interpreters for routine scheduled or user-triggered tasks — should be inventoried and excluded by specific script path rather than by directory or parent process trust"
    - "Software packaging/installer frameworks that legitimately invoke mshta.exe or wscript.exe for UI wizards or first-run configuration"
level: medium