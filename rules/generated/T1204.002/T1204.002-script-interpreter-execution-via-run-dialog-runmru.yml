title: "T1204.002 - Script Interpreter Execution via Run Dialog (RunMRU)"
id: 5a0f062a-9ca1-4ec6-ab97-a72c5b15daaa
status: experimental
description: "Detects Windows Run dialog (RunMRU) entries invoking script/HTA interpreters such as mshta, wscript, cscript, powershell, or rundll32, indicating a user was lured into manually executing attacker-supplied code."
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-27
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: registry_set
    product: windows
detection:
    selection_runmru:
      TargetObject|contains: '\Explorer\RunMRU\'
    selection_interpreter:
      Details|contains:
        - 'mshta.exe'
        - 'wscript.exe'
        - 'cscript.exe'
        - 'powershell.exe'
        - 'rundll32.exe'
    condition: selection_runmru and selection_interpreter
falsepositives:
    - "IT/help-desk administrative use of the Run dialog to launch mshta, wscript, cscript, powershell, or rundll32 for legitimate troubleshooting or scripted administration"
    - "Software installers, shortcuts, or scheduled maintenance tooling that populate RunMRU with interpreter-based commands pointing to legitimate internal scripts or local paths"
    - "Legitimate use of rundll32 or powershell via Run dialog for routine system configuration tasks that happen to reference user-writable directories"
level: medium