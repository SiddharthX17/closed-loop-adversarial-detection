title: "WSH Interpreter Executing Suspicious Script Files"
id: 8bd8748f-a0ce-49ef-8dab-dca1103351eb
status: experimental
description: "Detects cscript.exe or wscript.exe executing .vbs/.js/.jse/.wsf script files from user-writable staging directories (Temp, Public, AppData/Roaming), a common initial-execution pattern for malicious scripts delivered via email, HTA, or archive extraction."
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-28
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_interpreter:
      - Image|endswith:
          - '\cscript.exe'
          - '\wscript.exe'
      - OriginalFileName:
          - 'cscript.exe'
          - 'wscript.exe'
    selection_script_ext:
      CommandLine|contains:
        - '.vbs'
        - '.vbe'
        - '.js'
        - '.jse'
        - '.wsf'
    selection_staging_path:
      CommandLine|contains:
        - '\Temp\'
        - '\Public\'
        - '\AppData\Roaming\'
        - '\AppData\Local\'
        - '\Downloads\'
    condition: selection_interpreter and selection_script_ext and selection_staging_path
falsepositives:
    - "Legitimate administrative or logon VBScript/JScript automation executed from Temp or user profile paths by software deployment tools (e.g., SCCM) — should be exempted via a maintained allowlist of specific known-good script hashes or paths rather than broad directory exclusion"
    - "IT-deployed logon scripts executed from mapped drives or local caches of NETLOGON/SYSVOL content that happen to reside under a user's AppData or Temp folder during execution"
    - "Developer or power-user scripts intentionally staged in Temp/Downloads for legitimate testing or automation purposes"
    - "Chained execution from mshta.exe or other LOLBins invoking cscript/wscript on staged scripts (covered here since the script file and path are the anchor, independent of parent process)"
level: medium