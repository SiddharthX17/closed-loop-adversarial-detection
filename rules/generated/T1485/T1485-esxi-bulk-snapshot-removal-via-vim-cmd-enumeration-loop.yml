title: "ESXi Bulk Snapshot Removal via vim-cmd Enumeration Loop"
id: a0d8fe1d-6850-4576-8cee-bc43028b6cee
status: experimental
references:
    - https://attack.mitre.org/techniques/T1485/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-19
tags:
    - attack.impact
    - attack.t1485
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_enum:
      CommandLine|contains: 'vim-cmd vmsvc/getallvms'
    selection_destroy:
      CommandLine|contains:
        - 'vim-cmd vmsvc/snapshot.removeall'
        - 'vim-cmd vmsvc/destroy'
    condition: selection_enum and selection_destroy
falsepositives:
    - "Custom internal automation scripts that legitimately enumerate all VMs and bulk-remove snapshots or destroy VMs via scripted SSH loops from an endpoint rather than through vCenter GUI/API — rare but possible in some environments with homegrown ESXi lifecycle tooling; verify against a change-management/automation account allowlist rather than exempting by process path"
    - "Security or backup software performing legitimate scripted snapshot consolidation across all VMs on a host as part of a maintenance window, if such tooling issues vim-cmd commands directly via SSH instead of using the vSphere API"
    - "Penetration testing or red team exercises simulating this exact technique"
level: critical