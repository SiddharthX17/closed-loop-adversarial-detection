title: "Bulk Random Byte Generation and File Write Loop for Destructive Impact"
id: 633cdbb8-8fac-4949-ab03-893b244c96c0
status: experimental
references:
    - https://attack.mitre.org/techniques/T1486/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-19
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
    product: windows
detection:
    selection_bytearray:
        CommandLine|contains:
          - 'new-object byte[]'
          - 'New-Object Byte[]'
          - 'System.Byte[]'
    selection_random:
        CommandLine|contains:
          - 'NextBytes'
          - 'RNGCryptoServiceProvider'
    selection_loop:
        CommandLine|contains:
          - 'ForEach-Object'
          - '|%{'
          - '| %{'
          - '1..100'
    selection_write:
        CommandLine|contains:
          - 'WriteAllBytes'
          - '[IO.File]::'
          - 'System.IO.File'
    condition: selection_bytearray and selection_random and selection_loop and selection_write
falsepositives:
    - "Legitimate PowerShell scripts performing benchmarking, disk-fill testing, or cryptographic key/test-data generation that combine random byte arrays with looped file writes (rare in normal operations, but possible in QA/perf-test tooling)"
    - "Internal secure-erase or disk-wipe utilities implemented in PowerShell rather than a signed dedicated binary, which would legitimately produce this same command-line pattern"
    - "Developer or sysadmin ad-hoc scripts generating large dummy files for storage/quota testing using the same .NET byte-array and WriteAllBytes primitives"
level: critical