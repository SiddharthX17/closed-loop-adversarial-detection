title: Suspicious Svchost-Hosted Service Creation via Command Line
id: 95b7c5ac-00e8-435d-a3bb-f1dcd143fb1f
status: experimental
description: |
  Detects creation of a Windows service configured to run under svchost.exe with a service group switch
  and shared process type, combined with a registry write registering a new Svchost group. This pattern
  is characteristic of malicious service DLL persistence masquerading as a legitimate svchost-hosted
  service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: detection-engineer
date: 2025-01-01
tags:
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_service_create:
    CommandLine|contains|all:
      - 'svchost.exe -k'
      - 'type='
      - 'share'
  selection_sc_binary:
    CommandLine|contains:
      - 'sc create'
      - 'sc.exe create'
      - 'sc  create'
  selection_svchost_regadd:
    CommandLine|contains|all:
      - 'reg'
      - 'CurrentVersion\Svchost'
      - 'REG_MULTI_SZ'
  filter_legit_groups:
    CommandLine|contains:
      - 'netsvcs'
      - 'LocalServiceNetworkRestricted'
      - 'LocalServiceNoNetwork'
      - 'LocalServiceAndNoImpersonation'
      - 'localService'
  condition: selection_service_create and selection_sc_binary and selection_svchost_regadd and not filter_legit_groups
falsepositives:
  - Legitimate software or OS updates creating new svchost service groups (e.g., Windows Update, vendor installers)
  - Enterprise deployment tools (SCCM, Intune) performing valid service registration during patch cycles
level: high