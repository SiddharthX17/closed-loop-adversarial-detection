title: Svchost Service Group Hijack via ServiceDll Registry Add Command
id: 059a4e48-ef54-458f-a398-c992404f0122
status: experimental
description: >
  Detects a process command line that both creates/configures a service with
  binPath referencing svchost.exe -k (svchost service group hosting) and adds
  a ServiceDll value under that service's Parameters registry key. This
  command chain is the structural signature of svchost service group hijacking
  for persistence and execution as a trusted host process, regardless of the
  specific service or DLL name used.
references:
  - https://attack.mitre.org/techniques/T1543/003/
tags:
  - attack.t1543.003
author: detection-engineer
date: 2024-06-01
logsource:
  category: process_creation
  product: windows
detection:
  selection_svchost_binpath:
    CommandLine|contains:
      - 'svchost.exe -k'
  selection_sc_create:
    CommandLine|contains:
      - 'sc create'
      - 'sc  create'
      - 'sc.exe create'
  selection_servicedll:
    CommandLine|contains: 'ServiceDll'
  selection_parameters:
    CommandLine|contains: '\Parameters'
  filter_installers:
    Image|endswith:
      - '\TrustedInstaller.exe'
      - '\msiexec.exe'
      - '\wusa.exe'
      - '\ccmexec.exe'
      - '\IntuneManagementExtension.exe'
  condition: selection_svchost_binpath and selection_sc_create and selection_servicedll and selection_parameters and not filter_installers
falsepositives:
  - Legitimate administrative scripting creating shared svchost services followed by ServiceDll configuration
  - Software installers registering shared services via svchost.exe -k and configuring ServiceDll through non-installer processes
level: high