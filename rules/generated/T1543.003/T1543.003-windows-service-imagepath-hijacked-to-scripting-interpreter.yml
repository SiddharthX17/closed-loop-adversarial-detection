title: "Windows Service ImagePath Hijacked to Scripting Interpreter"
id: c380a957-a8b3-4845-9aac-337cc41868f5
status: experimental
description: "Detects sc.exe or reg.exe reconfiguring an existing Windows service's binary path to a scripting interpreter or download-cradle command, indicating service hijack for persistence and privileged code execution."
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
      Image|endswith: '\sc.exe'
      CommandLine|contains: 'config'
      CommandLine|contains: 'binpath'
    selection_reg:
      Image|endswith: '\reg.exe'
      CommandLine|contains: 'add'
      CommandLine|contains: 'Services'
      CommandLine|contains: 'ImagePath'
    payload_indicator:
      CommandLine|contains:
        - 'powershell.exe'
        - 'cmd.exe'
        - 'wscript.exe'
        - 'cscript.exe'
        - 'mshta.exe'
        - 'rundll32.exe'
        - 'IEX'
        - 'Invoke-Expression'
        - 'DownloadString'
        - '-enc'
    condition: (selection_sc or selection_reg) and payload_indicator
falsepositives:
    - "Legitimate software installers or repair routines reconfiguring their own service ImagePath to a signed vendor executable (this rule does not filter on signature/hash, so verify the target binary identity manually before closing as benign)"
    - "IT automation or configuration management tools (SCCM, Ansible, PowerShell DSC) that legitimately change service binaries during patch cycles, though pointing them at powershell.exe/cmd.exe/wscript.exe/mshta.exe/rundll32.exe or download-cradle syntax is atypical for routine administration"
    - "Help desk or manual sc.exe/reg.exe troubleshooting of service configuration where the new ImagePath happens to reference a scripting interpreter for legitimate diagnostic wrapper scripts (rare, should be individually verified)"
level: high