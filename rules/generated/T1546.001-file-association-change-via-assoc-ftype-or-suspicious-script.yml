title: "T1546.001 - File Association Change via assoc/ftype or Suspicious Script"
id: 62b19731-dcc1-4430-9f2b-c9b104d19621
status: experimental
references:
    - https://attack.mitre.org/techniques/T1546/001/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-07-23
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1546.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_assoc:
        CommandLine|contains: 'assoc '
        CommandLine|contains: '='
    selection_ftype:
        CommandLine|contains: 'ftype '
        CommandLine|contains: '='
    selection_script_name:
        Image|endswith:
          - '\wscript.exe'
          - '\cscript.exe'
          - '\powershell.exe'
        CommandLine|contains: 'assoc'
    condition: selection_assoc or selection_ftype or selection_script_name
falsepositives:
    - "Legitimate administrative or deployment scripts using assoc/ftype to configure file type policy across a fleet - review the extension and target handler for legitimacy, especially reassignment of high-risk extensions (.jsp, .txt, .exe, .bat, .vbs, .js, .htm) to unexpected handlers"
    - "IT helpdesk or support scripts run interactively via cmd.exe to fix broken file associations"
    - "Software installers that shell out to assoc/ftype during setup rather than writing the registry directly"
    - "Script files named with 'assoc' in the filename that are benign utilities unrelated to file-association tampering (naming-based false positive from the script-name heuristic)"
    - "Benign wscript/cscript/powershell script execution referencing the word 'assoc' in an unrelated context (e.g. variable names, comments) since this branch relies on a loose command-line substring match and is a lower-confidence supporting signal"
level: medium