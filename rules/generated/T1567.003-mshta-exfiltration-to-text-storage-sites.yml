title: MSHTA Exfiltration to Text Storage Sites
id: 5bc1f333-996f-4515-9073-6542ac46ce30
status: experimental
description: >
  Detects MSHTA (HTML Application Host) executing VBScript that performs HTTP POST requests
  to known text storage sites (pastebin.com, paste.ee, hastebin.com, ghostbin.com).
  Indicative of exfiltration via T1567.003 using MSXML2.XMLHTTP for data exfiltration.
references:
  - https://attack.mitre.org/techniques/T1567/003/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: custom
date: 2026-05-06
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith: 'mshta.exe'
    OriginalFileName: 'mshta.exe'
  selection_cmdline_storage_sites:
    CommandLine|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'ghostbin.com'
  selection_cmdline_http_method:
    CommandLine|contains:
      - 'XMLHTTP'
      - '.Open('
      - '.Send('
  selection_cmdline_post:
    CommandLine|contains:
      - 'POST'
      - 'api_post.php'
      - 'api_option=paste'
  condition: selection_process and selection_cmdline_storage_sites and selection_cmdline_http_method and selection_cmdline_post
falsepositives:
  - Unlikely in enterprise environments; MSHTA with XMLHTTP POST to paste sites is highly suspicious
level: high