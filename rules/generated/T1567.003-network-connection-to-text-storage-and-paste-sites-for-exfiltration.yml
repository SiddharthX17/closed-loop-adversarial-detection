title: Network Connection to Text Storage and Paste Sites for Exfiltration
id: 96c4cfbc-baad-4170-9a71-df706ce57e0b
status: experimental
description: >
  Detects outbound TCP network connections to known text storage and paste sites
  initiated by processes running in user or system context. This pattern is
  indicative of data exfiltration via T1567.003 where adversaries leverage
  publicly accessible content-sharing platforms to exfiltrate sensitive data,
  bypassing traditional DLP controls.
references:
  - https://attack.mitre.org/techniques/T1567/003/
  - https://web.archive.org/web/20201107203304/https://www.echosec.net/blog/what-is-pastebin-and-why-do-hackers-love-it
author: custom
date: 2026-06-07
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: network_connection
  product: windows
detection:
  selection_destination:
    DestinationHostname|contains:
      - 'pastebin.com'
      - 'pastebin.pl'
      - 'paste.ee'
      - 'hastebin.com'
      - 'hasteb.in'
      - 'ghostbin.com'
      - 'pastie.org'
      - 'dpaste.com'
      - 'dpaste.org'
      - 'paste.debian.net'
      - 'paste2.org'
      - 'controlc.com'
      - 'pst.klgrth.io'
      - 'gist.github.com'
      - 'gist.githubusercontent.com'
      - 'privatebin.net'
      - 'paste.fo'
      - 'rentry.co'
      - 'paste.rs'
      - 'bin.bpaste.net'
      - 'bpaste.net'
      - 'termbin.com'
      - 'ix.io'
      - 'sprunge.us'
      - 'clbin.com'
  selection_connection:
    Initiated: 'true'
    Protocol: 'tcp'
    DestinationPort:
      - 80
      - 443
  filter_known_tools:
    Image|contains:
      - '\AppData\Local\Programs\Microsoft VS Code\'
      - '\JetBrains\'
      - '\GitHub Desktop\'
      - '\GitHubDesktop\'
  condition: selection_destination and selection_connection and not filter_known_tools
falsepositives:
  - Legitimate developer activity sharing code snippets or logs via paste sites
  - System administrators troubleshooting via paste sites
  - Automated monitoring or log aggregation tools uploading diagnostic data
  - Software development workflows using paste services for collaboration
  - Security researchers or IT staff intentionally using paste sites for analysis
level: medium