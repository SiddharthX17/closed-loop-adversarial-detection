title: Network Connection to Text Storage Sites from User-Interactive Process
id: 17c277a0-618f-4fca-aa29-e679bcfc4d97
status: experimental
description: >
  Detects outbound TCP connections to known text storage and paste sites initiated
  by user-interactive processes such as cmd.exe, powershell.exe, or explorer.exe.
  This pattern is indicative of data exfiltration via T1567.003 where adversaries
  upload sensitive data to publicly accessible text hosting platforms to bypass
  DLP controls.
references:
  - https://attack.mitre.org/techniques/T1567/003/
  - https://web.archive.org/web/20201107203304/https://www.echosec.net/blog/what-is-pastebin-and-why-do-hackers-love-it
author: custom
date: 2026-06-07
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: network_connection
  product: windows
detection:
  selection_destination:
    DestinationHostname|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'ghostbin.com'
      - 'pastie.org'
      - 'dpaste.com'
      - 'paste.org'
      - 'controlc.com'
      - 'paste2.org'
      - 'rentry.co'
      - 'privatebin.net'
      - 'justpaste.it'
      - 'paste.sh'
      - 'termbin.com'
      - 'ix.io'
      - 'sprunge.us'
      - 'paste.debian.net'
      - 'bpaste.net'
  selection_port:
    DestinationPort:
      - 80
      - 443
      - 8080
      - 8443
  selection_protocol:
    Protocol: 'tcp'
  selection_initiated:
    Initiated: 'true'
  selection_image:
    Image|contains:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '\python.exe'
      - '\python3.exe'
      - '\perl.exe'
      - '\ruby.exe'
      - '\node.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
  filter_system_paths:
    Image|contains:
      - '\Windows\System32\svchost.exe'
      - '\Windows\System32\services.exe'
      - '\Windows\System32\lsass.exe'
  condition: selection_destination and selection_port and selection_protocol and selection_initiated and selection_image and not filter_system_paths
falsepositives:
  - Legitimate developer use of paste sites for code sharing from command-line tools
  - Security researchers or vulnerability disclosure workflows
  - Automated diagnostic or log aggregation tools using paste APIs
  - Third-party software telemetry mechanisms
level: high