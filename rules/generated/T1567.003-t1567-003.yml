title: MSHTA Exfiltration to Text Storage Sites
id: 7c2a6835-d05f-4d0a-91d6-8eb43df7c2a8
status: experimental
description: >
  Detects MSHTA (HTML Application Host) executing VBScript or JavaScript that
  performs HTTP POST requests to known text storage sites (pastebin.com, paste.ee,
  hastebin.com, ghostbin.com). This is indicative of data exfiltration via T1567.003.
  Also detects direct network connections to these domains from suspicious processes.
references:
  - https://attack.mitre.org/techniques/T1567/003/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: custom
date: 2026-05-06
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_mshta_process:
    Image|endswith: '\mshta.exe'
    OriginalFileName: 'mshta.exe'
  selection_mshta_cmdline:
    CommandLine|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'ghostbin.com'
  selection_mshta_method:
    CommandLine|contains:
      - 'XMLHTTP'
      - 'WinHttp'
      - 'InternetExplorer.Application'
  condition: selection_mshta_process and selection_mshta_cmdline and selection_mshta_method
---
title: Network Connection to Text Storage Sites
id: 7c2a6835-d05f-4d0a-91d6-8eb43df7c2a8
status: experimental
description: >
  Detects network connections to known text storage sites (pastebin.com, paste.ee,
  hastebin.com, ghostbin.com) from suspicious processes. Indicative of data
  exfiltration via T1567.003.
references:
  - https://attack.mitre.org/techniques/T1567/003/
author: custom
date: 2026-05-06
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: network_connection
  product: windows
detection:
  selection_destination:
    DestinationHostname|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'ghostbin.com'
  selection_process:
    Image|endswith:
      - '\mshta.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\cscript.exe'
      - '\wscript.exe'
  condition: selection_destination and selection_process
falsepositives:
  - Unlikely in enterprise environments
level: high