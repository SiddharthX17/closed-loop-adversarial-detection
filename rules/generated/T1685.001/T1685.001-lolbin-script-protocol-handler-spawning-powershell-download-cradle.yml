title: "LOLBin Script-Protocol Handler Spawning PowerShell Download Cradle"
id: 8ea72355-9c48-4b99-8f31-4026fcad0f19
status: experimental
description: "Detects mshta.exe or rundll32.exe invoked with an embedded vbscript:/javascript: protocol handler that spawns a shell or PowerShell child performing a remote download-and-import cradle — a delivery pattern used to stage tools like Invoke-Phant0m for disabling Windows Event Log collection, but also used to stage many other post-exploitation payloads via the same LOLBin abuse technique."
references:
    - https://attack.mitre.org/techniques/T1685/001/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.defense-impairment
    - attack.t1685.001
    - attack.t1218.005
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_lolbin:
      Image|endswith:
        - '\mshta.exe'
        - '\rundll32.exe'
      CommandLine|contains:
        - 'vbscript:'
        - 'javascript:'
    selection_shell:
      CommandLine|contains:
        - 'cmd.exe'
        - 'powershell'
        - 'wscript'
    selection_download_cradle:
      CommandLine|contains:
        - 'DownloadFile'
        - 'DownloadString'
        - 'Invoke-WebRequest'
        - 'Net.WebClient'
    selection_load_indicator:
      CommandLine|contains:
        - 'Import-Module'
        - 'IEX'
        - 'Invoke-Expression'
    selection_toolname:
      CommandLine|contains: 'Invoke-Phant0m'
    condition: (selection_lolbin and selection_shell) or (selection_download_cradle and selection_load_indicator) or selection_toolname
falsepositives:
    - "Legacy line-of-business applications that use mshta.exe or rundll32.exe with embedded vbscript:/javascript: handlers to spawn a shell child as part of legitimate automation (rare but possible in some enterprise environments)"
    - "Administrators or CI/CD pipelines using PowerShell WebClient/Invoke-WebRequest to download and Import-Module a script from an internal or GitHub-hosted repository as part of authorized software deployment"
    - "Authorized red-team or security tooling engagements deliberately invoking Invoke-Phant0m or similarly named tools for sanctioned testing — requires manual allowlisting by host and timeframe rather than automated exclusion"
    - "Unknown external domains used in legitimate but unvetted download cradles cannot be reliably distinguished from malicious staging without an internal allowlist; such cases should be flagged for manual triage rather than silently suppressed"
level: high