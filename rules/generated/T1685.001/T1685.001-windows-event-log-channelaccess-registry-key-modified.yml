title: "Windows Event Log ChannelAccess Registry Key Modified"
id: 39273117-ab68-4959-9750-1cfd255f5a97
status: experimental
description: "Detects a write to the ChannelAccess registry value under an EventLog channel's Policies key, which controls the SDDL access control on that log channel; attackers modify this to deny read/write access and impair or evade Windows Event Log collection."
references:
    - https://attack.mitre.org/techniques/T1685/001/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.defense-evasion
    - attack.t1685.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
      EventID: 13
      TargetObject|contains: '\Policies\Microsoft\Windows\EventLog\'
      TargetObject|endswith: '\ChannelAccess'
    deny_ace:
      Details|contains:
        - 'D;;'
    condition: selection
falsepositives:
    - "Legitimate GPO/security hardening baseline deployment (e.g., CIS/DISA STIG templates) that configures event log channel ACLs, typically only during initial hardening or scheduled policy pushes"
    - "Administrative SDDL adjustment for compliance or least-privilege tuning that modifies Allow ACEs (e.g., BA/AU permissions) without introducing a Deny ACE against broad principals — lower confidence but still matches this rule since Details is not hard-gated"
    - "Group Policy client (gpsvc) refresh cycles reapplying an already-deployed baseline SDDL to this key on schedule"
level: high