title: "Programmatic Windows Firewall Policy Modification"
id: 834e59e9-f73b-4e11-8173-bbe1dc5321e8
status: experimental
description: "Detects process command lines invoking the HNetCfg.FwPolicy2 COM object, netsh advfirewall commands, or NetSecurity PowerShell cmdlets to disable or weaken Windows Firewall protections, a common defense-impairment step used to permit inbound/outbound traffic for lateral movement or C2 egress."
references:
    - https://attack.mitre.org/techniques/T1686/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.defense-impairment
    - attack.t1686.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_com:
      CommandLine|contains:
        - 'HNetCfg.FwPolicy2'
        - 'EnableRuleGroup'
        - 'EnableRule'
    selection_netsecurity_cmdlets:
      CommandLine|contains:
        - 'Set-NetFirewallProfile'
        - 'Disable-NetFirewallRule'
        - 'New-NetFirewallRule'
        - 'Set-NetFirewallRule'
    selection_netsh:
      CommandLine|contains:
        - 'advfirewall set'
        - 'advfirewall firewall add rule'
        - 'firewall add rule'
    filter_vendor_binary:
      Image|contains:
        - '\Microsoft\Windows Defender\'
        - '\CrowdStrike\'
        - '\Windows Defender Advanced Threat Protection\'
    condition: (selection_com or selection_netsecurity_cmdlets or selection_netsh) and not filter_vendor_binary
falsepositives:
    - "Legitimate administrative firewall configuration performed via GPO scripts, SCCM/Intune baseline enforcement, or manual admin use of netsh/PowerShell NetSecurity cmdlets"
    - "Security software (AV/EDR) installers or agents adjusting firewall exceptions during install/reconfiguration, only partially filtered here by known vendor install paths — installers dropped in unusual paths will still alert"
    - "IT hardening or rollback scripts that toggle firewall profiles or rule groups as part of routine maintenance"
level: high