title: "Windows Firewall Network Profile Category Registry Change"
id: 4a268db0-5a4c-4bcd-9795-2232ec4af6e6
status: experimental
description: "Detects modification of the NetworkList Profiles Category registry value, which reclassifies a network's trust level (Public/Private/Domain) and directly governs Windows Firewall profile enforcement; attackers alter this value to weaken firewall restrictions and enable unrestricted network activity."
references:
    - https://attack.mitre.org/techniques/T1686/003/
author: "Defender Agent — Detection Engineering Automation"
date: 2026-09-29
tags:
    - attack.defense-impairment
    - attack.t1686.003
logsource:
    category: registry_set
    product: windows
detection:
    selection:
      TargetObject|contains: '\NetworkList\Profiles\'
      TargetObject|endswith: '\Category'
    condition: selection
falsepositives:
    - "Legitimate network connectivity changes such as connecting to new Wi-Fi, VPN reconnects, docking/undocking, domain join or leave, and DHCP lease renewals on laptops and roaming devices — this single registry class cannot self-distinguish intent and should be correlated with concurrent netsh/PowerShell firewall-disable command activity for higher-confidence alerting"
    - "IT-managed network profile scripting via MDM or GPO during device onboarding or network policy enforcement"
    - "Standalone occurrence of this event is high-volume and low-precision on roaming endpoints; treat as a corroborating signal rather than a definitive indicator unless paired with other firewall-tampering evidence"
level: low