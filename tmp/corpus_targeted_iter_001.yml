name: corpus-targeted-iter_001
# Auto-generated by pipeline/corpus/yaml_generator.py
# Iteration: iter_001
# Clusters: 1 | Feasible: 1 | Variants: 3
# Do not edit manually — regenerated each iteration.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-corpus:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Sysmon
        shell: powershell
        run: |
          $sysmonUrl = "https://download.sysinternals.com/files/Sysmon.zip"
          $configUrl = "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml"
          Invoke-WebRequest -Uri $sysmonUrl -OutFile Sysmon.zip
          Expand-Archive -Path Sysmon.zip -DestinationPath Sysmon
          Invoke-WebRequest -Uri $configUrl -OutFile sysmonconfig.xml
          .\Sysmon\Sysmon64.exe -accepteula -i sysmonconfig.xml
          Start-Sleep -Seconds 3
          Write-Host "Sysmon installed"

      # Cluster: singleton_fa8f1946-e3c9-4076-bec8-e3764b0d373d
      # Intent: Detect scheduled task creation via PowerShell or schtasks that combines task automation with suspicious download/code execution patterns commonly used for persistence and lateral movement.
      # Rules: fa8f1946-e3c9-4076-bec8-e3764b0d373d
      - name: "Detect scheduled task creation via PowerShell or s [IT admin workflow]"
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set TASKNAME=ConfigMgmtHealthCheck
          set SCRIPTPATH=%TEMP%\health_check_v2.ps1
          set LOGPATH=%TEMP%\healthcheck.log

          REM Create a benign PowerShell script that performs system health diagnostics
          (
          echo # System health check script for IT Operations
          echo $logFile = '%LOGPATH%'
          echo $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          echo $osInfo = Get-WmiObject -Class Win32_OperatingSystem
          echo $diskSpace = Get-Volume -DriveLetter C
          echo $output = @"
          echo Health Check Report: $timestamp
          echo OS Version: $($osInfo.Caption)
          echo Disk Free: $($diskSpace.SizeRemaining / 1GB) GB
          echo "@
          echo Add-Content -Path $logFile -Value $output
          echo Write-Host "Health check completed at $timestamp"
          ) > "!SCRIPTPATH!"

          REM Create scheduled task that runs the health check script on system startup
          REM Using /ru SYSTEM to run with service account (common IT admin pattern)
          schtasks /create /tn "!TASKNAME!" /tr "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"!SCRIPTPATH!\"" /sc onstart /ru SYSTEM /rl HIGHEST /f

          REM Verify task was created
          schtasks /query /tn "!TASKNAME!" /v

          REM Cleanup: Remove the scheduled task after 2 seconds to avoid persistent state in CI
          timeout /t 2 /nobreak
          schtasks /delete /tn "!TASKNAME!" /f

          REM Clean up temporary files
          del /q "!SCRIPTPATH!" 2>nul
          del /q "!LOGPATH!" 2>nul

          echo Task creation and cleanup completed successfully
          endlocal


      - name: "Detect scheduled task creation via PowerShell or s [Software installer/updater workflow]"
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # Infrastructure automation: Create scheduled task for automated system patching and updates
          $taskName = 'SystemPatchDeployment'
          $taskDescription = 'Automated patch deployment and system validation for IT operations'
          $scriptPath = Join-Path $env:TEMP 'deploy_patches.ps1'
          $logFile = Join-Path $env:TEMP 'patch_deploy.log'

          # Create the patch deployment script
          $patchScript = @'
          # Windows Update and patch validation script
          $logPath = '{0}'
          $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          $output = "Patch validation started at $timestamp"
          Add-Content -Path $logPath -Value $output

          # Check for pending updates
          $updates = Get-WmiObject -Namespace "root\cimv2" -Class Win32_QuickFixEngineering
          $updateCount = @($updates).Count
          Add-Content -Path $logPath -Value "Found $updateCount installed patches"

          # Verify system integrity
          $services = Get-Service | Where-Object {$_.Status -eq 'Running'}
          Add-Content -Path $logPath -Value "Running services count: $($services.Count)"

          Write-Host "Patch validation completed"
          '@ -replace '{0}', $logFile

          Set-Content -Path $scriptPath -Value $patchScript -Encoding UTF8

          # Define task trigger (logon trigger is common for system maintenance tasks)
          $trigger = New-ScheduledTaskTrigger -AtLogOn

          # Define task action
          $action = New-ScheduledTaskAction `
              -Execute 'powershell.exe' `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`""

          # Define task principal with specific user context (common for installer workflows)
          $principal = New-ScheduledTaskPrincipal `
              -UserID 'NT AUTHORITY\SYSTEM' `
              -LogonType ServiceAccount `
              -RunLevel Highest

          # Create the scheduled task
          try {
              $task = Register-ScheduledTask `
                  -TaskName $taskName `
                  -Description $taskDescription `
                  -Trigger $trigger `
                  -Action $action `
                  -Principal $principal `
                  -Force
              Write-Host "Scheduled task '$taskName' registered successfully"
          }
          catch {
              Write-Host "Task registration failed: $_"
          }

          # Verify task creation
          $existingTask = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($existingTask) {
              Write-Host "Task verification successful: $($existingTask.TaskName)"
          }

          # Cleanup: Remove task and temporary files
          Start-Sleep -Seconds 2

          if ($existingTask) {
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
              Write-Host "Scheduled task removed"
          }

          Remove-Item -Path $scriptPath -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $logFile -Force -ErrorAction SilentlyContinue

          Write-Host "Cleanup completed"


      - name: "Detect scheduled task creation via PowerShell or s [IT admin workflow]"
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set TASKNAME=SystemDiagnosticsOnce
          set SCRIPTPATH=%TEMP%\system_diagnostics.ps1
          set REPORTPATH=%TEMP%\diag_report.txt

          REM Create diagnostic PowerShell script
          (
          echo # Comprehensive system diagnostics and validation
          echo $reportFile = '%REPORTPATH%'
          echo $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          echo
           echo Write-Host "System Diagnostics Report - $timestamp"
          echo Add-Content -Path $reportFile -Value "=== System Diagnostics Report ==="
          echo Add-Content -Path $reportFile -Value "Timestamp: $timestamp"
          echo
          echo # Network diagnostics
          echo $ipconfig = ipconfig /all
          echo Add-Content -Path $reportFile -Value "Network Configuration: $($ipconfig.Count) interfaces"
          echo
          echo # System information
          echo $computerInfo = Get-ComputerInfo
          echo Add-Content -Path $reportFile -Value "Computer Name: $($computerInfo.CsComputerName)"
          echo Add-Content -Path $reportFile -Value "OS Build: $($computerInfo.OsVersion)"
          echo
          echo # Running processes summary
          echo $procCount = @(Get-Process).Count
          echo Add-Content -Path $reportFile -Value "Running Processes: $procCount"
          echo
          echo Write-Host "Diagnostics completed successfully"
          ) > "!SCRIPTPATH!"

          REM Get current date/time for once trigger (must be in future)
          for /f "tokens=2-4 delims=/ " %%a in ('date /t') do (set mydate=%%c-%%a-%%b)
          for /f "tokens=1-2 delims=/" %%a in ('time /t') do (set mytime=%%a:%%b)

          REM Schedule task to run once (common for one-off diagnostics)
          schtasks /create /tn "!TASKNAME!" /tr "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"!SCRIPTPATH!\"" /sc once /st 23:59 /ru SYSTEM /rp "" /f

          REM Verify task creation
          echo Verifying scheduled task creation...
          schtasks /query /tn "!TASKNAME!" /v /fo list

          REM Cleanup: Delete the task and files
          timeout /t 2 /nobreak
          schtasks /delete /tn "!TASKNAME!" /f

          del /q "!SCRIPTPATH!" 2>nul
          del /q "!REPORTPATH!" 2>nul

          echo Diagnostic task creation workflow completed
          endlocal


      - name: Export and commit corpus logs
        shell: powershell
        run: |
          $exportDir = "corpus\\benign"
          $processDir = "$exportDir\\process"
          $networkDir = "$exportDir\\network"
          $registryDir = "$exportDir\\registry"
          New-Item -ItemType Directory -Force -Path $processDir, $networkDir, $registryDir | Out-Null

          # Query Sysmon EventLog and export by EventID
          $eidMap = @{
            1  = $processDir
            11 = $processDir
            3  = $networkDir
            12 = $registryDir
            13 = $registryDir
          }

          foreach ($eid in $eidMap.Keys) {
            $outFile = "$($eidMap[$eid])\\targeted_iter_001_eid${eid}.jsonl"
            try {
              Get-WinEvent -FilterHashtable @{
                LogName = "Microsoft-Windows-Sysmon/Operational"
                Id = $eid
              } -ErrorAction SilentlyContinue |
              ForEach-Object {
                $props = $_.Properties | ForEach-Object { $_.Value }
                [PSCustomObject]@{
                  Channel   = "Microsoft-Windows-Sysmon/Operational"
                  EventID   = $eid
                  TimeCreated = $_.TimeCreated.ToString("o")
                  Message   = $_.Message
                  RawProps  = ($props -join "|")
                } | ConvertTo-Json -Compress
              } | Out-File -Append -Encoding utf8 $outFile
              Write-Host "EID $eid: exported to $outFile"
            } catch {
              Write-Host "EID $eid: no events or error: $_"
            }
          }

          git config user.name "corpus-bot"
          git config user.email "corpus-bot@pipeline"
          git add corpus/benign/
          $count = (git diff --cached --name-only | Measure-Object -Line).Lines
          if ($count -gt 0) {
            git commit -m "corpus: targeted stress-test iteration iter_001 [skip ci]"
            try {
                git push
                Write-Host "Committed $count corpus files"
                } catch {
                Write-Host "git push failed: $_"
                }
          } else {
            Write-Host "No new corpus files to commit"
          }

      - name: Uninstall Sysmon
        shell: powershell
        if: always()
        run: |
          .\Sysmon\Sysmon64.exe -u force 2>$null
          Write-Host "Sysmon uninstalled"
